import React, { useState, useEffect, useMemo } from 'react';
import { initializeApp } from 'firebase/app';
import { 
  getAuth, 
  signInAnonymously, 
  signInWithCustomToken, 
  onAuthStateChanged 
} from 'firebase/auth';
import { 
  getFirestore, 
  doc, 
  setDoc, 
  onSnapshot 
} from 'firebase/firestore';
import { ChevronLeft, ChevronRight, Save, Calculator, CalendarDays, Clock, DollarSign } from 'lucide-react';

// --- Firebase Initialization ---
const firebaseConfig = typeof __firebase_config !== 'undefined' 
  ? JSON.parse(__firebase_config) 
  : { apiKey: "mock-key", projectId: "mock-project" };

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const appId = typeof __app_id !== 'undefined' ? __app_id : 'salary-tracker-app';

// --- Utility Functions ---
const formatMinsToHHMM = (mins) => {
  if (!mins || isNaN(mins)) return "00:00";
  const h = Math.floor(mins / 60);
  const m = Math.floor(mins % 60);
  return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
};

const calcTimeMetrics = (inTime, outTime, regHours) => {
  if (!inTime || !outTime) return { totalMins: 0, otMins: 0, decimalTotal: 0, decimalOT: 0 };
  
  const [inH, inM] = inTime.split(':').map(Number);
  const [outH, outM] = outTime.split(':').map(Number);
  
  let inTotal = inH * 60 + inM;
  let outTotal = outH * 60 + outM;
  
  // Handle cross-midnight (e.g., in at 22:00, out at 02:00)
  if (outTotal < inTotal) outTotal += 24 * 60;
  
  const totalMins = outTotal - inTotal;
  const regMins = (Number(regHours) || 0) * 60;
  const otMins = Math.max(0, totalMins - regMins);
  
  return { 
    totalMins, 
    otMins,
    decimalTotal: +(totalMins / 60).toFixed(2),
    decimalOT: +(otMins / 60).toFixed(2)
  };
};

export default function App() {
  const [user, setUser] = useState(null);
  const [currentDate, setCurrentDate] = useState(new Date());
  
  // Data State
  const [settings, setSettings] = useState({ fixedSalary: 0, otRate: 0, defaultRegHours: 8 });
  const [monthData, setMonthData] = useState({});
  const [loading, setLoading] = useState(true);

  // --- Auth Effect (Mandatory Firebase Rule 3) ---
  useEffect(() => {
    const initAuth = async () => {
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
      } catch (err) {
        console.error("Auth error:", err);
      }
    };
    initAuth();
    
    const unsubscribe = onAuthStateChanged(auth, (u) => {
      setUser(u);
    });
    return () => unsubscribe();
  }, []);

  // --- Data Fetching Effect (Mandatory Firebase Rule 1 & 2) ---
  useEffect(() => {
    if (!user) return;
    setLoading(true);

    const year = currentDate.getFullYear();
    const month = String(currentDate.getMonth() + 1).padStart(2, '0');
    const monthKey = `${year}-${month}`;

    // Paths strictly follow Rule 1
    const settingsRef = doc(db, 'artifacts', appId, 'users', user.uid, 'salary_settings');
    const monthRef = doc(db, 'artifacts', appId, 'users', user.uid, `month_${monthKey}`);

    // Listen to Settings
    const unsubSettings = onSnapshot(settingsRef, (docSnap) => {
      if (docSnap.exists()) {
        setSettings(prev => ({ ...prev, ...docSnap.data() }));
      }
    }, (err) => console.error("Error fetching settings:", err));

    // Listen to Month Data
    const unsubMonth = onSnapshot(monthRef, (docSnap) => {
      if (docSnap.exists()) {
        setMonthData(docSnap.data());
      } else {
        setMonthData({});
      }
      setLoading(false);
    }, (err) => {
      console.error("Error fetching month data:", err);
      setLoading(false);
    });

    return () => {
      unsubSettings();
      unsubMonth();
    };
  }, [user, currentDate]);

  // --- Handlers ---
  const handlePrevMonth = () => {
    setCurrentDate(prev => new Date(prev.getFullYear(), prev.getMonth() - 1, 1));
  };

  const handleNextMonth = () => {
    setCurrentDate(prev => new Date(prev.getFullYear(), prev.getMonth() + 1, 1));
  };

  const handleSettingChange = async (field, value) => {
    const numValue = Number(value) || 0;
    setSettings(prev => ({ ...prev, [field]: numValue }));
    
    if (user) {
      const settingsRef = doc(db, 'artifacts', appId, 'users', user.uid, 'salary_settings');
      await setDoc(settingsRef, { [field]: numValue }, { merge: true });
    }
  };

  const handleDayChange = async (dateStr, field, value) => {
    // Optimistic local update for snappy UI
    setMonthData(prev => ({
      ...prev,
      [dateStr]: {
        ...(prev[dateStr] || { regHours: settings.defaultRegHours, type: 'Regular' }),
        [field]: value
      }
    }));

    if (user) {
      const yearMonth = dateStr.substring(0, 7); // e.g., "2026-11"
      const monthRef = doc(db, 'artifacts', appId, 'users', user.uid, `month_${yearMonth}`);
      
      // Update specific day object in Firestore using dot notation
      await setDoc(monthRef, {
        [dateStr]: {
          ...(monthData[dateStr] || { regHours: settings.defaultRegHours, type: 'Regular' }),
          [field]: value
        }
      }, { merge: true });
    }
  };

  // --- Computations ---
  const daysInMonth = useMemo(() => {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();
    const numDays = new Date(year, month + 1, 0).getDate();
    
    return Array.from({ length: numDays }, (_, i) => {
      const dateObj = new Date(year, month, i + 1);
      return {
        dateStr: `${year}-${String(month + 1).padStart(2, '0')}-${String(i + 1).padStart(2, '0')}`,
        displayDate: `${String(i + 1).padStart(2, '0')}/${String(month + 1).padStart(2, '0')}`,
        dayName: dateObj.toLocaleDateString('en-US', { weekday: 'short' }),
        isWeekend: dateObj.getDay() === 0 || dateObj.getDay() === 6 // Sun = 0, Sat = 6
      };
    });
  }, [currentDate]);

  const summary = useMemo(() => {
    let totalMinsWorked = 0;
    let totalOTMins = 0;
    let totalOTAmount = 0;

    daysInMonth.forEach(({ dateStr }) => {
      const dayData = monthData[dateStr] || {};
      const regHours = dayData.regHours !== undefined ? dayData.regHours : settings.defaultRegHours;
      const metrics = calcTimeMetrics(dayData.inTime, dayData.outTime, regHours);
      
      totalMinsWorked += metrics.totalMins;
      totalOTMins += metrics.otMins;
      totalOTAmount += metrics.decimalOT * (settings.otRate || 0);
    });

    return {
      totalMinsWorked,
      totalOTMins,
      totalOTAmount: Math.round(totalOTAmount),
      totalSalary: Math.round((settings.fixedSalary || 0) + totalOTAmount)
    };
  }, [monthData, daysInMonth, settings]);

  if (!user || loading) {
    return (
      <div className="flex h-screen items-center justify-center bg-gray-50 text-gray-500">
        <div className="animate-spin mr-3"><Calculator size={24} /></div>
        Loading Timesheet...
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-slate-100 p-2 md:p-6 font-sans text-slate-800">
      <div className="max-w-7xl mx-auto space-y-6">
        
        {/* Header & Month Navigation */}
        <div className="bg-white rounded-xl shadow-sm p-4 md:p-6 flex flex-col md:flex-row items-center justify-between gap-4 border border-slate-200">
          <div className="flex items-center gap-3 text-indigo-700">
            <div className="p-2 bg-indigo-100 rounded-lg"><CalendarDays size={28} /></div>
            <div>
              <h1 className="text-2xl font-bold tracking-tight">Timesheet & OT Tracker</h1>
              <p className="text-sm text-slate-500 font-medium">Daily Working Hours Log</p>
            </div>
          </div>
          
          <div className="flex items-center gap-4 bg-slate-50 rounded-lg p-1 border border-slate-200">
            <button onClick={handlePrevMonth} className="p-2 hover:bg-white rounded-md transition-colors text-slate-600 hover:text-indigo-600 shadow-sm"><ChevronLeft size={20}/></button>
            <span className="font-bold text-lg min-w-[160px] text-center text-slate-800">
              {currentDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}
            </span>
            <button onClick={handleNextMonth} className="p-2 hover:bg-white rounded-md transition-colors text-slate-600 hover:text-indigo-600 shadow-sm"><ChevronRight size={20}/></button>
          </div>
        </div>

        {/* Dashboard Cards */}
        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
          <div className="bg-white p-4 rounded-xl shadow-sm border-l-4 border-l-blue-500 border border-slate-200 hover:shadow-md transition-shadow">
            <div className="flex justify-between items-start mb-2">
              <p className="text-xs font-bold text-slate-500 uppercase tracking-wider">Fixed Base Salary</p>
              <DollarSign size={16} className="text-blue-300" />
            </div>
            <div className="flex items-center gap-1">
              <span className="text-xl font-bold text-slate-400">₹</span>
              <input 
                type="number" 
                value={settings.fixedSalary || ''} 
                onChange={(e) => handleSettingChange('fixedSalary', e.target.value)}
                className="w-full text-2xl font-black bg-transparent border-b border-transparent hover:border-slate-300 focus:outline-none focus:border-blue-500 transition-colors"
                placeholder="0"
              />
            </div>
          </div>
          
          <div className="bg-white p-4 rounded-xl shadow-sm border-l-4 border-l-orange-500 border border-slate-200 hover:shadow-md transition-shadow">
             <div className="flex justify-between items-start mb-2">
              <p className="text-xs font-bold text-slate-500 uppercase tracking-wider">OT Rate / Hour</p>
              <Clock size={16} className="text-orange-300" />
            </div>
            <div className="flex items-center gap-1">
              <span className="text-xl font-bold text-slate-400">₹</span>
              <input 
                type="number" 
                value={settings.otRate || ''} 
                onChange={(e) => handleSettingChange('otRate', e.target.value)}
                className="w-full text-2xl font-black bg-transparent border-b border-transparent hover:border-slate-300 focus:outline-none focus:border-orange-500 transition-colors"
                placeholder="0"
              />
            </div>
          </div>
          
          <div className="bg-white p-4 rounded-xl shadow-sm border-l-4 border-l-purple-500 border border-slate-200">
             <div className="flex justify-between items-start mb-2">
              <p className="text-xs font-bold text-slate-500 uppercase tracking-wider">Total OT (Month)</p>
              <Calculator size={16} className="text-purple-300" />
            </div>
            <p className="text-2xl font-black text-purple-700">
              {formatMinsToHHMM(summary.totalOTMins)} <span className="text-sm font-semibold text-slate-400">hrs</span>
            </p>
            <p className="text-sm font-bold text-slate-500 mt-1">₹ {summary.totalOTAmount.toLocaleString()}</p>
          </div>
          
          <div className="bg-emerald-50 p-4 rounded-xl shadow-sm border-l-4 border-l-emerald-500 border border-emerald-100">
            <div className="flex justify-between items-start mb-2">
              <p className="text-xs font-bold text-emerald-700 uppercase tracking-wider">Net Salary</p>
              <DollarSign size={16} className="text-emerald-400" />
            </div>
            <p className="text-3xl font-black text-emerald-700 mt-1 truncate" title={`₹ ${summary.totalSalary.toLocaleString()}`}>
              ₹ {summary.totalSalary.toLocaleString()}
            </p>
          </div>
        </div>

        {/* Excel-Like Data Table */}
        <div className="bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col">
          <div className="overflow-x-auto rounded-t-xl">
            <table className="w-full text-sm text-left border-collapse">
              <thead className="text-xs text-slate-700 uppercase bg-slate-100 sticky top-0 z-10 shadow-sm">
                <tr>
                  <th className="px-3 py-3 border border-slate-200 text-center w-16 whitespace-nowrap">Date</th>
                  <th className="px-3 py-3 border border-slate-200 w-24">Day</th>
                  <th className="px-3 py-3 border border-slate-200 w-32">Type</th>
                  <th className="px-3 py-3 border border-slate-200 w-32">In Time</th>
                  <th className="px-3 py-3 border border-slate-200 w-32">Out Time</th>
                  <th className="px-3 py-3 border border-slate-200 text-center w-24 bg-blue-50">Reg. Hrs</th>
                  <th className="px-3 py-3 border border-slate-200 text-center w-28">Total Work</th>
                  <th className="px-3 py-3 border border-slate-200 text-center w-28 bg-orange-50">OT Hours</th>
                  <th className="px-3 py-3 border border-slate-200 text-right w-32 bg-emerald-50">OT Amount</th>
                </tr>
              </thead>
              <tbody className="bg-white">
                {daysInMonth.map((day) => {
                  const dayData = monthData[day.dateStr] || {};
                  const type = dayData.type || (day.isWeekend ? 'Weekend' : 'Regular');
                  const regHrs = dayData.regHours !== undefined ? dayData.regHours : settings.defaultRegHours;
                  const metrics = calcTimeMetrics(dayData.inTime, dayData.outTime, regHrs);
                  
                  // Row styling based on day type
                  let rowClass = "hover:bg-slate-50 transition-colors group";
                  if (type === 'Weekend') rowClass += " bg-red-50/40 hover:bg-red-50/60";
                  if (type === 'Holiday') rowClass += " bg-purple-50/40 hover:bg-purple-50/60";
                  if (type === 'Leave') rowClass += " bg-yellow-50/40 hover:bg-yellow-50/60";

                  return (
                    <tr key={day.dateStr} className={rowClass}>
                      <td className="px-2 py-1.5 border border-slate-200 text-center font-semibold text-slate-600 whitespace-nowrap">
                        {day.displayDate}
                      </td>
                      <td className={`px-2 py-1.5 border border-slate-200 font-medium ${day.isWeekend ? 'text-red-500' : 'text-slate-600'}`}>
                        {day.dayName}
                      </td>
                      <td className="p-0 border border-slate-200">
                        <select 
                          value={type}
                          onChange={(e) => handleDayChange(day.dateStr, 'type', e.target.value)}
                          className="w-full h-full min-h-[36px] bg-transparent border-none text-slate-700 text-sm focus:ring-2 focus:ring-inset focus:ring-blue-500 px-2 cursor-pointer outline-none"
                        >
                          <option value="Regular">Regular</option>
                          <option value="Weekend">Weekend</option>
                          <option value="Holiday">Holiday</option>
                          <option value="Leave">Leave</option>
                        </select>
                      </td>
                      <td className="p-0 border border-slate-200 relative">
                        <input 
                          type="time" 
                          value={dayData.inTime || ''}
                          onChange={(e) => handleDayChange(day.dateStr, 'inTime', e.target.value)}
                          className="w-full h-full min-h-[36px] bg-transparent border-none px-2 text-slate-700 focus:ring-2 focus:ring-inset focus:ring-blue-500 outline-none"
                        />
                      </td>
                      <td className="p-0 border border-slate-200 relative">
                        <input 
                          type="time" 
                          value={dayData.outTime || ''}
                          onChange={(e) => handleDayChange(day.dateStr, 'outTime', e.target.value)}
                          className="w-full h-full min-h-[36px] bg-transparent border-none px-2 text-slate-700 focus:ring-2 focus:ring-inset focus:ring-blue-500 outline-none"
                        />
                      </td>
                      <td className="p-0 border border-slate-200 bg-blue-50/30">
                         <input 
                          type="number" 
                          step="0.5"
                          value={regHrs}
                          onChange={(e) => handleDayChange(day.dateStr, 'regHours', Number(e.target.value))}
                          className="w-full h-full min-h-[36px] bg-transparent border-none px-2 text-center text-slate-700 focus:ring-2 focus:ring-inset focus:ring-blue-500 outline-none"
                        />
                      </td>
                      <td className="px-2 py-1.5 border border-slate-200 text-center">
                        <div className="font-mono font-bold text-slate-700">{formatMinsToHHMM(metrics.totalMins)}</div>
                        <div className="text-[10px] text-slate-400 uppercase tracking-wider">{metrics.decimalTotal} Hrs</div>
                      </td>
                      <td className="px-2 py-1.5 border border-slate-200 text-center bg-orange-50/30">
                        <div className="font-mono font-bold text-orange-600">{formatMinsToHHMM(metrics.otMins)}</div>
                        <div className="text-[10px] text-orange-400 uppercase tracking-wider">{metrics.decimalOT} Hrs</div>
                      </td>
                      <td className="px-3 py-1.5 border border-slate-200 text-right bg-emerald-50/30 font-bold text-emerald-700">
                        ₹ {Math.round(metrics.decimalOT * (settings.otRate || 0)).toLocaleString()}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          
          {/* Footer Save Status */}
          <div className="bg-slate-50 p-3 text-xs font-medium text-slate-500 text-center border-t border-slate-200 flex items-center justify-center gap-2 rounded-b-xl">
            <Save size={14} className="text-indigo-500" /> 
            All data is saved automatically to the cloud. You can safely close this page at any time.
          </div>
        </div>

      </div>
    </div>
  );
}
```
