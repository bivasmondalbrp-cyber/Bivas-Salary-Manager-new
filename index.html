<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bivas Salary & Attendance Manager</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h2 {
            color: #004d99; /* Blue Theme */
            margin-bottom: 20px;
        }
        .controls {
            margin-bottom: 20px;
        }
        button {
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            color: white;
        }
        .btn-in { background-color: #28a745; } /* Green */
        .btn-out { background-color: #dc3545; } /* Red */
        .btn-export { background-color: #007bff; } /* Blue */
        .btn-clear { background-color: #ffc107; color: black; } /* Yellow */
        
        table {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }
        th {
            background-color: #28a745; /* Green header like your Excel */
            color: white;
        }
        .overtime-row {
            background-color: #fff3cd; /* Yellow highlight for overtime */
        }
    </style>
</head>
<body>

    <h2>Bivas Monthly Attendance & Salary Tracker</h2>
    <p>Daily Duty: 9 Hours | OT Rate: ₹105/hr</p>

    <div class="controls">
        <button class="btn-in" onclick="clockIn()">Clock IN</button>
        <button class="btn-out" onclick="clockOut()">Clock OUT</button>
    </div>

    <table id="attendanceTable">
        <thead>
            <tr>
                <th>Date</th>
                <th>In Time</th>
                <th>Out Time</th>
                <th>Total Hours</th>
                <th>Overtime</th>
                <th>Shortfall</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Data will appear here -->
        </tbody>
    </table>

    <div class="controls" style="margin-top: 20px;">
        <button class="btn-export" onclick="exportCSV()">Export to Excel (CSV)</button>
        <button class="btn-clear" onclick="clearData()">Clear Data</button>
    </div>

    <script>
        let attendanceData = JSON.parse(localStorage.getItem('bivasAttendance')) || [];

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            attendanceData.forEach((record, index) => {
                let row = `<tr class="${record.overtime !== '0h 0m' ? 'overtime-row' : ''}">
                    <td>${record.date}</td>
                    <td>${record.inTime || '--'}</td>
                    <td>${record.outTime || '--'}</td>
                    <td>${record.totalHours || '--'}</td>
                    <td>${record.overtime || '--'}</td>
                    <td>${record.shortfall || '--'}</td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        function getCurrentTime() {
            const now = new Date();
            return now.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit' });
        }

        function getCurrentDate() {
            const now = new Date();
            return now.toISOString().split('T')[0];
        }

        function calculateHours(inTime, outTime) {
            const [inH, inM] = inTime.split(':').map(Number);
            const [outH, outM] = outTime.split(':').map(Number);
            
            let totalMinutes = (outH * 60 + outM) - (inH * 60 + inM);
            if (totalMinutes < 0) totalMinutes += 24 * 60; // Handle overnight shift

            const hours = Math.floor(totalMinutes / 60);
            const minutes = totalMinutes % 60;
            
            let overtime = '0h 0m';
            let shortfall = '0h 0m';
            const standardMinutes = 9 * 60;

            if (totalMinutes > standardMinutes) {
                const otMins = totalMinutes - standardMinutes;
                overtime = `${Math.floor(otMins / 60)}h ${otMins % 60}m`;
            } else if (totalMinutes < standardMinutes) {
                const sfMins = standardMinutes - totalMinutes;
                shortfall = `${Math.floor(sfMins / 60)}h ${sfMins % 60}m`;
            }

            return {
                total: `${hours}h ${minutes}m`,
                overtime: overtime,
                shortfall: shortfall
            };
        }

        function clockIn() {
            const date = getCurrentDate();
            const time = getCurrentTime();
            let todayRecord = attendanceData.find(r => r.date === date);

            if (!todayRecord) {
                attendanceData.push({ date: date, inTime: time, outTime: '', totalHours: '', overtime: '', shortfall: '' });
                saveAndRender();
                alert(`Clocked IN at ${time}`);
            } else {
                alert("You have already clocked in today!");
            }
        }

        function clockOut() {
            const date = getCurrentDate();
            const time = getCurrentTime();
            let todayRecord = attendanceData.find(r => r.date === date);

            if (todayRecord && !todayRecord.outTime) {
                todayRecord.outTime = time;
                const calc = calculateHours(todayRecord.inTime, todayRecord.outTime);
                todayRecord.totalHours = calc.total;
                todayRecord.overtime = calc.overtime;
                todayRecord.shortfall = calc.shortfall;
                saveAndRender();
                alert(`Clocked OUT at ${time}`);
            } else if (!todayRecord) {
                alert("Please Clock IN first!");
            } else {
                alert("You have already clocked out today!");
            }
        }

        function saveAndRender() {
            localStorage.setItem('bivasAttendance', JSON.stringify(attendanceData));
            renderTable();
        }

        function clearData() {
            if(confirm("Are you sure you want to clear all data for this month?")) {
                attendanceData = [];
                saveAndRender();
            }
        }

        function exportCSV() {
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "Date,In Time,Out Time,Total Hours,Overtime,Shortfall\n";
            
            attendanceData.forEach(row => {
                csvContent += `${row.date},${row.inTime},${row.outTime},${row.totalHours},${row.overtime},${row.shortfall}\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "Bivas_Monthly_Attendance.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Initial render
        renderTable();
    </script>
</body>
</html>
