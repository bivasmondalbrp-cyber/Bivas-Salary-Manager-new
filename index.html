@media(max-width:420px){

<script>

/* ===== BASIC VARIABLES ===== */

const $=id=>document.getElementById(id);

const months=[
'January','February','March','April',
'May','June','July','August',
'September','October','November','December'
];

const SET_KEYS=[
'salary','dailyHours','clHours',
'epf','mediclaim','ptax'
];

let records={};
let holidays=[];
let monthSettings={};
let displayedMonthKey=null;


/* ===== MONTH KEY ===== */

function monthKey(){

 return `${$('year').value}-${String(+$('month').value+1).padStart(2,'0')}`;

}


/* ===== NUMBER ===== */

function num(id){

 return Math.max(0,Number($(id).value)||0);

}


/* ===== DATE KEY ===== */

function dateKey(y,m,d){

 return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

}


/* ===== SETTINGS ===== */

function settingsObject(){

 let s={};

 SET_KEYS.forEach(k=>s[k]=$(k).value);

 return s;

}


function saveSettings(){

 monthSettings[monthKey()]=settingsObject();

 localStorage.setItem(
  'bivas-month-settings',
  JSON.stringify(monthSettings)
 );

 localStorage.setItem(
  'bivas-current-settings',
  JSON.stringify(settingsObject())
 );

}


function applyMonthSettings(k){

 let s=monthSettings[k];

 if(!s)return;

 SET_KEYS.forEach(x=>{

  if(s[x]!==undefined){
   $(x).value=s[x];
  }

 });

}


/* ===== TIME FORMAT ===== */

function fmtTime(hours){

 let mins=Math.round(Math.max(0,hours)*60);

 return `${Math.floor(mins/60)} ঘ ${mins%60} মি`;

}


/* ===== PASSWORD ===== */

function hashPassword(p){

 let h=2166136261;

 for(let i=0;i<p.length;i++){

  h^=p.charCodeAt(i);

  h=Math.imul(h,16777619);

 }

 return (h>>>0).toString(16);

}


function ensurePassword(){

 let stored=localStorage.getItem('bivas-time-password');

 if(!stored){

  let p=prompt('নতুন Password তৈরি করুন:');

  if(!p)return false;

  if(p.length<4){

   alert('কমপক্ষে ৪ অক্ষরের Password দিন।');

   return false;

  }

  localStorage.setItem(
   'bivas-time-password',
   hashPassword(p)
  );

  return true;

 }

 let p=prompt('Password দিন:');

 if(p===null)return false;

 if(hashPassword(p)!==stored){

  alert('ভুল Password।');

  return false;

 }

 return true;

}


function changePassword(){

 let old=localStorage.getItem('bivas-time-password');

 if(old){

  let p=prompt('বর্তমান Password দিন:');

  if(p===null||hashPassword(p)!==old){

   alert('বর্তমান Password সঠিক নয়।');

   return;

  }

 }

 let n=prompt('নতুন Password দিন:');

 if(!n||n.length<4){

  alert('কমপক্ষে ৪ অক্ষরের Password দিন।');

  return;

 }

 localStorage.setItem(
  'bivas-time-password',
  hashPassword(n)
 );

 alert('Password পরিবর্তন হয়েছে।');

}


/* ===== END PART 2 ===== */

</script>
<script>

/* ===== PART 3: DATA LOAD & CALENDAR ===== */


/* HOLIDAY NAME */

function holidayName(date){

 let h=holidays.find(x=>x.date===date);

 return h?h.name:'';

}


/* DEFAULT TYPE */

function defaultType(date,day){

 return holidayName(date)
  ?'Holiday'
  :day===0
   ?'Sunday'
   :'Normal';

}


/* LOAD APPLICATION DATA */

function loadData(){

 try{

  records=JSON.parse(
   localStorage.getItem('bivas-records')||'{}'
  );

  holidays=JSON.parse(
   localStorage.getItem('bivas-holidays')||'[]'
  );

  monthSettings=JSON.parse(
   localStorage.getItem('bivas-month-settings')||'{}'
  );

 }catch(e){

  records={};
  holidays=[];
  monthSettings={};

 }

}


/* READ CURRENT ATTENDANCE */

function readRecords(targetKey){

 let o={};

 document.querySelectorAll('#attendance tr').forEach(tr=>{

  let el=tr.querySelector('.typ');

  if(!el)return;

  let date=el.dataset.date;

  o[date]={

   type:el.value,

   in:tr.querySelector('.in').value,

   out:tr.querySelector('.out').value

  };

 });

 records[targetKey]=o;

 return o;

}


/* SAVE CURRENT MONTH */

function saveCurrentMonth(){

 if(!displayedMonthKey)return;

 if($('attendance').children.length){

  readRecords(displayedMonthKey);

 }

 localStorage.setItem(
  'bivas-records',
  JSON.stringify(records)
 );

 saveSettings();

}


/* RENDER MONTH CALENDAR */

function renderMonth(){

 let yr=Number($('year').value);

 let mo=Number($('month').value);

 if(!Number.isInteger(yr)||yr<2000||yr>2100||
    !Number.isInteger(mo)||mo<0||mo>11){

  alert('সঠিক বছর ও মাস নির্বাচন করুন।');

  return;

 }

 let target=monthKey();

 /* SAVE PREVIOUS MONTH */

 if(displayedMonthKey){

  saveCurrentMonth();

 }

 /* LOAD NEW MONTH SETTINGS */

 if(target!==displayedMonthKey){

  if(monthSettings[target]){

   applyMonthSettings(target);

  }

 }

 displayedMonthKey=target;

 if(!monthSettings[target]){

  monthSettings[target]=settingsObject();

 }

 let totalDays=new Date(yr,mo+1,0).getDate();

 let tb=$('attendance');

 tb.innerHTML='';

 let saved=records[target]||{};

 for(let d=1;d<=totalDays;d++){

  let dt=dateKey(yr,mo,d);

  let day=new Date(yr,mo,d).getDay();

  let r=saved[dt]||{};

  /* AUTOMATIC HOLIDAY UPDATE */

  if(holidayName(dt)){

   r.type='Holiday';

  }else if(r.type==='Holiday'){

   r.type=day===0?'Sunday':'Normal';

  }

  if(!r.type){

   r.type=defaultType(dt,day);

  }

  let tr=document.createElement('tr');

  if(holidayName(dt)||r.type==='Holiday'){

   tr.classList.add('holiday-row');

  }else if(day===0||r.type==='Sunday'){

   tr.classList.add('sunday');

  }

  tr.innerHTML=`

   <td>${dt}</td>

   <td>${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][day]}</td>

   <td>

    <select data-date="${dt}" class="typ">

     <option value="Normal" ${r.type==='Normal'?'selected':''}>Normal</option>

     <option value="Sunday" ${r.type==='Sunday'?'selected':''}>Sunday</option>

     <option value="Holiday" ${r.type==='Holiday'?'selected':''}>Holiday</option>

     <option value="Off" ${r.type==='Off'?'selected':''}>Off</option>

     <option value="CL" ${r.type==='CL'?'selected':''}>CL</option>

    </select>

    ${holidayName(dt)?`<div class="muted">${holidayName(dt)}</div>`:''}

   </td>

   <td>
    <input type="time" class="in" value="${r.in||''}">
   </td>

   <td>
    <input type="time" class="out" value="${r.out||''}">
   </td>

   <td class="worked">0 ঘ 0 মি</td>

   <td class="regular">0 ঘ 0 মি</td>

   <td class="ot">0 ঘ 0 মি</td>

  `;

  tb.appendChild(tr);

 }


 /* PASSWORD PROTECTION */

 document.querySelectorAll('#attendance input[type="time"]').forEach(el=>{

  el.dataset.last=el.value;

  el.addEventListener('change',()=>{

   if(el.dataset.processing)return;

   el.dataset.processing='1';

   let newValue=el.value;

   if(newValue===el.dataset.last){

    el.dataset.processing='';

    return;

   }

   if(!ensurePassword()){

    el.value=el.dataset.last;

    calculate();

    el.dataset.processing='';

    return;

   }

   el.dataset.last=newValue;

   saveCurrentMonth();

   calculate();

   el.dataset.processing='';

  });

 });


 /* TYPE CHANGE */

 document.querySelectorAll('#attendance .typ').forEach(el=>{

  el.addEventListener('change',()=>{

   let dt=el.dataset.date;

   let tr=el.closest('tr');

   let day=new Date(dt+'T12:00:00').getDay();

   if(holidayName(dt)){

    el.value='Holiday';

   }

   tr.classList.remove('sunday','holiday-row');

   if(el.value==='Holiday'){

    tr.classList.add('holiday-row');

   }else if(day===0||el.value==='Sunday'){

    tr.classList.add('sunday');

   }

   saveCurrentMonth();

   calculate();

  });

 });


 /* SAVE CALENDAR DATA */

 records[target]=readRecords(target);

 calculate();

}


/* ===== END PART 3 ===== */

</script>
<script>

/* ===== PART 4: TIME & SALARY CALCULATION ===== */


/* TIME CALCULATION */

function getWorkedHours(inTime,outTime){

 if(!inTime||!outTime)return 0;

 let a=inTime.split(':').map(Number);
 let b=outTime.split(':').map(Number);

 let start=a[0]*60+a[1];
 let end=b[0]*60+b[1];

 if(start===end)return 0;

 let diff=end-start;

 if(diff<0)diff+=1440;

 return diff/60;

}


/* SALARY CALCULATION */

function calculate(){

 let rs=records[displayedMonthKey]||{};

 let requiredDays=0;
 let total=0;
 let totalRegular=0;
 let dailyOT=0;

 let dailyDuty=num('dailyHours');

 for(let [date,r] of Object.entries(rs)){

  let day=new Date(date+'T12:00:00').getDay();

  let type=holidayName(date)
   ?'Holiday'
   :(r.type||defaultType(date,day));

  let hrs=getWorkedHours(r.in,r.out);

  let regular=0;
  let extra=0;

  /* NORMAL DAY */

  if(type==='Normal'){

   requiredDays++;

   regular=Math.min(hrs,dailyDuty);

   extra=Math.max(0,hrs-dailyDuty);

  }

  /* SUNDAY AND HOLIDAY */

  else if(type==='Sunday'||type==='Holiday'){

   extra=hrs;

  }

  total+=hrs;
  dailyOT+=extra;
  totalRegular+=regular;

  let tr=document.querySelector(
   `#attendance .typ[data-date="${date}"]`
  )?.closest('tr');

  if(tr){

   tr.querySelector('.worked').textContent=fmtTime(hrs);

   tr.querySelector('.regular').textContent=fmtTime(regular);

   tr.querySelector('.ot').textContent=fmtTime(extra);

  }

 }


 /* REQUIRED DUTY HOURS */

 let required=requiredDays*dailyDuty;


 /* BASIC AND HOURLY RATE */

 let salary=num('salary');

 let daily=salary/25;

 let hourly=dailyDuty>0
  ?daily/dailyDuty
  :0;


 /* CL ADJUSTMENT */

 let clAdjusted=Math.min(
  Math.max(0,required-total),
  num('clHours')
 );


 /* SHORTFALL */

 let shortfall=Math.max(
  0,
  required-total-clAdjusted
 );


 /* SALARY SUMMARY OT */

 let summaryOT=Math.max(
  0,
  total+clAdjusted-required
 );


 /* AVAILABLE CL AFTER ADJUSTMENT */

 let availableCL=Math.max(
  0,
  num('clHours')-clAdjusted
 );


 /* FIRST PAYMENT */

 let deduction=shortfall*hourly;

 let first=
  salary-
  num('epf')-
  num('mediclaim')-
  num('ptax')-
  deduction;


 /* SECOND PAYMENT */

 let second=0;

 if(total>=totalRegular){

  /* NEW FORMULA */

  second=Math.max(
   0,
   (
    summaryOT+
    availableCL
   )*hourly
  );

 }else{

  /* OLD FORMULA */

  second=Math.max(
   0,
   (
    total+
    clAdjusted-
    required
   )*hourly
  );

 }


 /* TOTAL PAYMENT */

 let totalSalary=first+second;


 /* SUMMARY DISPLAY */

 let vals=[

  ['Daily Basic',`₹${daily.toFixed(2)}`],

  ['Hourly Rate',`₹${hourly.toFixed(2)}`],

  ['Normal Working Days',requiredDays],

  ['Required Duty Hours',fmtTime(required)],

  ['Total Worked Hours',fmtTime(total)],

  ['Total Regular Hours',fmtTime(totalRegular)],

  ['Daily Attendance OT',fmtTime(dailyOT)],

  ['Salary Summary OT',fmtTime(summaryOT)],

  ['Available CL',fmtTime(num('clHours'))],

  ['CL Adjusted',fmtTime(clAdjusted)],

  ['Shortfall',fmtTime(shortfall)],

  ['Shortfall Deduction',`₹${deduction.toFixed(2)}`],

  ['1st Payment',`₹${first.toFixed(2)}`],

  ['2nd Payment',`₹${second.toFixed(2)}`],

  ['TOTAL SALARY',`₹${totalSalary.toFixed(2)}`]

 ];


 $('summary').innerHTML=vals.map(([k,v])=>`

  <div class="stat">

   <label>${k}</label>

   <b class="${k==='TOTAL SALARY'?'good':''}">
    ${v}
   </b>

  </div>

 `).join('');

}


/* SAVE DATA */

function saveData(){

 saveCurrentMonth();

 calculate();

 saveSettings();

 alert('এই মাসের ডেটা Save হয়েছে।');

}


/* ===== END PART 4 ===== */

</script>
<script>

/* ===== PART 5: EXCEL DOWNLOAD ===== */


/* HOLIDAY LIST RENDER */

function renderHolidayList(){

 let box=$('holidayList');

 box.innerHTML='';

 holidays.forEach((h,index)=>{

  let div=document.createElement('div');

  div.className='holiday';

  div.textContent=h.date+' — '+h.name+' ';

  let btn=document.createElement('button');

  btn.className='danger';
  btn.textContent='মুছুন';

  btn.onclick=()=>{

   holidays.splice(index,1);

   localStorage.setItem(
    'bivas-holidays',
    JSON.stringify(holidays)
   );

   renderHolidayList();
   renderMonth();

  };

  div.appendChild(btn);

  box.appendChild(div);

 });

}


/* ADD HOLIDAY */

function addHoliday(){

 let date=$('holidayDate').value;
 let name=$('holidayName').value.trim();

 if(!date||!name){

  alert('তারিখ ও Holiday নাম দিন।');
  return;

 }

 holidays=holidays.filter(x=>x.date!==date);

 holidays.push({date,name});

 holidays.sort((a,b)=>a.date.localeCompare(b.date));

 localStorage.setItem(
  'bivas-holidays',
  JSON.stringify(holidays)
 );

 $('holidayDate').value='';
 $('holidayName').value='';

 renderHolidayList();
 renderMonth();

}


/* EXCEL DOWNLOAD */

function exportExcel(){

 try{

  saveCurrentMonth();
  calculate();

  let key=displayedMonthKey||monthKey();

  let rs=records[key]||{};

  let [year,month]=key.split('-');

  let rows=[];

  rows.push(['BIVAS SALARY MANAGER']);
  rows.push(['Month',months[Number(month)-1]+' '+year]);
  rows.push([]);

  rows.push([
   'Date','Day','Type',
   'In Time','Out Time',
   'Worked','Regular','Daily OT'
  ]);

  let total=0;
  let regularTotal=0;
  let otTotal=0;

  Object.keys(rs).sort().forEach(date=>{

   let r=rs[date];

   let day=new Date(date+'T12:00:00').getDay();

   let type=holidayName(date)
    ?'Holiday'
    :(r.type||defaultType(date,day));

   let worked=getWorkedHours(r.in,r.out);

   let regular=0;
   let ot=0;

   let duty=num('dailyHours');

   if(type==='Normal'){

    regular=Math.min(worked,duty);
    ot=Math.max(0,worked-duty);

   }else if(type==='Sunday'||type==='Holiday'){

    ot=worked;

   }

   total+=worked;
   regularTotal+=regular;
   otTotal+=ot;

   rows.push([

    date,

    ['Sunday','Monday','Tuesday','Wednesday',
     'Thursday','Friday','Saturday'][day],

    type,

    r.in||'',
    r.out||'',

    fmtTime(worked),
    fmtTime(regular),
    fmtTime(ot)

   ]);

  });


  rows.push([]);

  rows.push(['Total Worked',fmtTime(total)]);
  rows.push(['Total Regular',fmtTime(regularTotal)]);
  rows.push(['Daily Attendance OT',fmtTime(otTotal)]);

  rows.push([]);

  rows.push(['SALARY SUMMARY']);

  $('summary').innerText.split('\n').forEach(line=>{

   let t=line.trim();

   if(t)rows.push([t]);

  });


  function escapeCSV(value){

   return '"'+String(value??'').replace(/"/g,'""')+'"';

  }

  let csv='\uFEFF'+rows.map(row=>
   row.map(escapeCSV).join(',')
  ).join('\r\n');


  let blob=new Blob(
   [csv],
   {type:'text/csv;charset=utf-8;'}
  );

  let url=URL.createObjectURL(blob);

  let filename=`BIVAS_SALARY_${key}.csv`;

  let a=document.createElement('a');

  a.href=url;
  a.download=filename;

  document.body.appendChild(a);

  a.click();

  a.remove();

  $('downloadLink').href=url;
  $('downloadLink').download=filename;

  $('downloadFallback').classList.remove('hidden');

  setTimeout(()=>URL.revokeObjectURL(url),60000);

 }catch(e){

  alert('Excel Download সমস্যা: '+e.message);

  console.error(e);

 }

}

  holidays:holidays,
  monthSettings:monthSettings,
  currentSettings:settingsObject()

 };

  [JSON.stringify(data,null,2)],
  {type:'application/json'}
 );

 a.download='BIVAS_SALARY_BACKUP.json';

 a.remove();

 setTimeout(()=>URL.revokeObjectURL(url),60000);

}


/* RESTORE */

function restore(event){

 let file=event.target.files[0];

 if(!file)return;

 let reader=new FileReader();

 reader.onload=function(){

  try{

   let data=JSON.parse(reader.result);

   if(!data.records){

    throw new Error('Invalid backup');

   }

   records=data.records||{};
   holidays=data.holidays||[];
   monthSettings=data.monthSettings||{};

   localStorage.setItem(
    'bivas-records',
    JSON.stringify(records)
   );

   localStorage.setItem(
    'bivas-holidays',
    JSON.stringify(holidays)
   );

   localStorage.setItem(
    'bivas-month-settings',
    JSON.stringify(monthSettings)
   );

   if(data.currentSettings){

    localStorage.setItem(
     'bivas-current-settings',
     JSON.stringify(data.currentSettings)
    );

   }

   alert('Backup Restore হয়েছে।');

   location.reload();

  }catch(e){

   alert('Backup File সঠিক নয়।');

  }

 };

 reader.readAsText(file);

 event.target.value='';

}


/* PREVIOUS MONTH HISTORY */

function showHistory(){

 let y=Number($('historyYear').value);
 let m=Number($('historyMonth').value);

 let key=`${y}-${String(m+1).padStart(2,'0')}`;

 let rs=records[key]||{};

 let cfg=monthSettings[key]||{};

 let duty=Number(cfg.dailyHours)||0;

 let total=0;
 let ot=0;
 let days=0;

 Object.entries(rs).forEach(([date,r])=>{

  let day=new Date(date+'T12:00:00').getDay();

  let type=holidayName(date)
   ?'Holiday'
   :(r.type||defaultType(date,day));

  let worked=getWorkedHours(r.in,r.out);

  if(type==='Normal'){

   days++;

   ot+=Math.max(0,worked-duty);

  }else if(type==='Sunday'||type==='Holiday'){

   ot+=worked;

  }

  total+=worked;

 });

 $('historyResult').textContent=

  `${months[m]} ${y} | `+
  `Worked: ${fmtTime(total)} | `+
  `Required: ${fmtTime(days*duty)} | `+
  `OT: ${fmtTime(ot)} | `+
  `Basic Salary: ₹${cfg.salary||0}`;

}
