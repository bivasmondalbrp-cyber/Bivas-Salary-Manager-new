<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salary & Attendance Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f7f6; text-align: center; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        button { padding: 12px 24px; font-size: 16px; margin: 10px; cursor: pointer; border: none; border-radius: 5px; color: white; }
        .btn-in { background-color: #28a745; }
        .btn-out { background-color: #dc3545; }
        .btn-export { background-color: #007bff; display: block; width: 100%; margin-top: 20px; }
        #history { margin-top: 20px; text-align: left; max-height: 300px; overflow-y: auto; }
        .record-item { background: #eee; margin: 5px 0; padding: 10px; border-radius: 5px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>অ্যাটেনডেন্স ও স্যালারি ট্র্যাকার</h2>
        
        <button class="btn-in" onclick="recordTime('Punch In')">Punch In (প্রবেশ)</button>
        <button class="btn-out" onclick="recordTime('Punch Out')">Punch Out (প্রস্থান)</button>
        
        <h3 style="text-align: left; margin-top: 30px;">পুরোনো রেকর্ড:</h3>
        <div id="history"></div>

        <button class="btn-export" onclick="exportCSV()">CSV ডাউনলোড করুন</button>
    </div>

    <script>
        function recordTime(type) {
            const now = new Date();
            const timeString = now.toLocaleString('en-IN');
            let records = JSON.parse(localStorage.getItem('salaryTrackerRecords')) || [];
            
            records.push({ type: type, time: timeString });
            localStorage.setItem('salaryTrackerRecords', JSON.stringify(records));
            displayHistory();
        }

        function displayHistory() {
            let records = JSON.parse(localStorage.getItem('salaryTrackerRecords')) || [];
            let historyDiv = document.getElementById('history');
            historyDiv.innerHTML = '';
            
            // Show latest records first
            records.slice().reverse().forEach(r => {
                let div = document.createElement('div');
                div.className = 'record-item';
                div.innerHTML = `<b>${r.type}</b>: ${r.time}`;
                historyDiv.appendChild(div);
            });
        }
