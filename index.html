<html lang="bn">
<head>
<meta charset="utf-8">

<style>
:root{
--blue:#123c69;
--bg:#f2f5f9;
--card:#fff;
--green:#147d54;
--red:#b42318;
}

*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,'Noto Sans Bengali',sans-serif;
background:var(--bg);
color:#17212b;
}

header{
background:var(--blue);
color:white;
padding:18px 16px;
font-weight:700;
font-size:20px;
}

.wrap{
padding:12px;

margin:auto;
}

.card{
background:var(--card);
padding:14px;
border-radius:12px;
margin:10px 0;
box-shadow:0 2px 8px #13243a12;
}

h2{
font-size:17px;
margin:0 0 12px;
color:var(--blue);
}

.grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:10px;
}

label{
font-size:13px;
color:#455468;
display:block;
margin-bottom:5px;
}

input,select,button{
font:inherit;
}

input,select{
width:100%;
padding:10px;
border:1px solid #cbd5e1;
border-radius:8px;
background:white;
}

button{
border:0;
border-radius:8px;
padding:11px 13px;
background:var(--blue);
color:white;
font-weight:600;
margin:4px 3px 4px 0;
}

button.secondary{
background:#e4ebf3;
color:#18324e;
}

button.danger{
background:#b42318;
}

.stat{
background:#f4f7fb;
border-radius:8px;
padding:10px;
}

.stat b{
display:block;
font-size:17px;
margin-top:5px;
}

.row{
display:flex;
gap:8px;
align-items:end;
flex-wrap:wrap;
}

.row>*{
flex:1;
min-width:100px;
}

.tablewrap{
overflow-x:auto;
}

table{
border-collapse:collapse;
width:100%;
font-size:12px;
min-width:780px;
}

th,td{
border-bottom:1px solid #e3e8ef;
padding:8px;
text-align:left;
}

th{
background:#edf2f8;
}

td input,td select{
min-width:100px;
padding:7px;
}

.muted{
font-size:12px;
color:#667085;
line-height:1.5;
}

.good{color:var(--green)}
.bad{color:var(--red)}

.actions{
display:flex;
flex-wrap:wrap;
}

.hidden{display:none}

.holiday{
font-size:13px;
padding:6px 0;
border-bottom:1px solid #eee;
}

.notice{
padding:9px 11px;
border-radius:8px;
background:#fff7e6;
color:#754c00;
font-size:12px;
line-height:1.5;
}

tr.sunday td{
background:#e8f5e9;
}

tr.holiday-row td{
background:#fff0dc;
}

@media(max-width:420px){
.grid{
grid-template-columns:1fr 1fr;
}
.stat b{
font-size:15px;
}
}
</style>
</head>

<body>

<header>
BIVAS SALARY MANAGER

<main class="wrap">

<div class="row">

<div>
<label>বছর</label>
<input id="historyYear" type="number" value="2026">
</div>

<div>
<label>মাস</label>

<select id="historyMonth">
<option value="0">January</option>
<option value="1">February</option>
<option value="2">March</option>
<option value="3">April</option>
<option value="4">May</option>
<option value="5">June</option>
<option value="6">July</option>
<option value="7">August</option>
<option value="8">September</option>
<option value="9">October</option>
<option value="10">November</option>
<option value="11">December</option>
</select>

</div>

<div style="flex:0">
<button onclick="showHistory()">হিসাব দেখুন</button>
</div>

</div>

<script>

const $=id=>document.getElementById(id);

const months=[
'January','February','March','April',
'May','June','July','August',
'September','October','November','December'
];

const SET_KEYS=[
'salary','dailyHours','clHours',
'epf','mediclaim','ptax'
];

let records={};
let holidays=[];
let monthSettings={};
let displayedMonthKey=null;

function monthKey(){
 return `${$('year').value}-${String(+$('month').value+1).padStart(2,'0')}`;
}

function num(id){
 return Math.max(0,Number($(id).value)||0);
}

function dateKey(y,m,d){
 return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

function settingsObject(){
 let s={};
 SET_KEYS.forEach(k=>s[k]=$(k).value);
 return s;
}

function saveSettings(){

 monthSettings[monthKey()]=settingsObject();

 localStorage.setItem(
 'bivas-month-settings',
 JSON.stringify(monthSettings)
 );

 localStorage.setItem(
 'bivas-current-settings',
 JSON.stringify(settingsObject())
 );
}

function applyMonthSettings(k){

 let s=monthSettings[k];

 if(s){
  SET_KEYS.forEach(x=>{
   if(s[x]!==undefined)$(x).value=s[x];
  });
 }
}

function fmtTime(hours){

 let mins=Math.round(Math.max(0,hours)*60);

 return `${Math.floor(mins/60)} ঘ ${mins%60} মি`;
}

function hashPassword(p){

 let h=2166136261;

 for(let i=0;i<p.length;i++){
  h^=p.charCodeAt(i);
  h=Math.imul(h,16777619);
 }

 return (h>>>0).toString(16);
}

function ensurePassword(){

 let stored=localStorage.getItem('bivas-time-password');

 if(!stored){

  let p=prompt('নতুন Password তৈরি করুন:');

  if(!p)return false;

  if(p.length<4){
   alert('কমপক্ষে ৪ অক্ষরের Password দিন।');
   return false;
  }

  localStorage.setItem(
  'bivas-time-password',
  hashPassword(p)
  );

  return true;
 }

 let p=prompt('Password দিন:');

 if(p===null)return false;

 if(hashPassword(p)!==stored){
  alert('ভুল Password।');
  return false;
 }

 return true;
}

function changePassword(){

 let old=localStorage.getItem('bivas-time-password');

 if(old){

  let p=prompt('বর্তমান Password দিন:');

  if(p===null||hashPassword(p)!==old){
   alert('বর্তমান Password সঠিক নয়।');
   return;
  }
 }

 let n=prompt('নতুন Password দিন:');

 if(!n||n.length<4){
  alert('কমপক্ষে ৪ অক্ষরের Password দিন।');
  return;
 }

 localStorage.setItem(
 'bivas-time-password',
 hashPassword(n)
 );

 alert('Password পরিবর্তন হয়েছে।');
}

</script>
<script>

// LOAD APPLICATION DATA

function init(){

 try{

  records=JSON.parse(
   localStorage.getItem('bivas-records')||'{}'
  );

  holidays=JSON.parse(
   localStorage.getItem('bivas-holidays')||'[]'
  );

  monthSettings=JSON.parse(
   localStorage.getItem('bivas-month-settings')||'{}'
  );

 }catch(e){

  records={};
  holidays=[];
  monthSettings={};

 }

 let now=new Date();

 $('year').value=now.getFullYear();
 $('month').value=now.getMonth();

 $('historyYear').value=now.getFullYear();
 $('historyMonth').value=now.getMonth();

 let k=monthKey();

 if(monthSettings[k]){

  applyMonthSettings(k);

 }else{

  let saved=JSON.parse(
   localStorage.getItem('bivas-current-settings')||'null'
  );

  if(saved){

   Object.entries(saved).forEach(([id,value])=>{

    if($(id))$(id).value=value;

   });

  }

  monthSettings[k]=settingsObject();

 }

 renderHolidayList();

 renderMonth();

}


// HOLIDAY NAME

function holidayName(date){

 let h=holidays.find(x=>x.date===date);

 return h?h.name:'';

}


// DEFAULT ATTENDANCE TYPE

function defaultType(date,day){

 return holidayName(date)
  ?'Holiday'
  :day===0
   ?'Sunday'
   :'Normal';

}


// READ ATTENDANCE DATA

function readRecords(targetKey=displayedMonthKey||monthKey()){

 let o={};

 document.querySelectorAll('#attendance tr').forEach(tr=>{

  let el=tr.querySelector('.typ');

  if(!el)return;

  let date=el.dataset.date;

  o[date]={

   type:el.value,

   in:tr.querySelector('.in').value,

   out:tr.querySelector('.out').value

  };

 });

 records[targetKey]=o;

 return o;

}


// SAVE CURRENT MONTH

function saveCurrentMonth(){

 if($('attendance').children.length){

  readRecords(displayedMonthKey||monthKey());

 }

 localStorage.setItem(
  'bivas-records',
  JSON.stringify(records)
 );

}


// RENDER CALENDAR

function renderMonth(){

 let yr=Number($('year').value);
 let mo=Number($('month').value);

 if(!Number.isInteger(yr)||yr<2000||yr>2100||
    !Number.isInteger(mo)||mo<0||mo>11){

  alert('সঠিক বছর ও মাস নির্বাচন করুন।');

  return;

 }

 if(displayedMonthKey){

  readRecords(displayedMonthKey);

  monthSettings[displayedMonthKey]=settingsObject();

  localStorage.setItem(
   'bivas-records',
   JSON.stringify(records)
  );

  localStorage.setItem(
   'bivas-month-settings',
   JSON.stringify(monthSettings)
  );

 }

 let target=monthKey();

 if(displayedMonthKey!==target){

  applyMonthSettings(target);

 }

 if(!monthSettings[target]){

  monthSettings[target]=settingsObject();

 }

 displayedMonthKey=target;

 saveSettings();

 let totalDays=new Date(yr,mo+1,0).getDate();

 let tb=$('attendance');

 tb.innerHTML='';

 let saved=records[target]||{};

 for(let d=1;d<=totalDays;d++){

  let dt=dateKey(yr,mo,d);

  let day=new Date(yr,mo,d).getDay();

  let r=saved[dt]||{};

  if(holidayName(dt)){

   r.type='Holiday';

  }else if(r.type==='Holiday'){

   r.type=day===0?'Sunday':'Normal';

  }

  if(!r.type){

   r.type=defaultType(dt,day);

  }

  let tr=document.createElement('tr');

  if(holidayName(dt)||r.type==='Holiday'){

   tr.classList.add('holiday-row');

  }else if(day===0||r.type==='Sunday'){

   tr.classList.add('sunday');

  }

  tr.innerHTML=`

   <td>${dt}</td>

   <td>${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][day]}</td>

   <td>

    <select data-date="${dt}" class="typ">

     <option value="Normal" ${r.type==='Normal'?'selected':''}>Normal</option>

     <option value="Sunday" ${r.type==='Sunday'?'selected':''}>Sunday</option>

     <option value="Holiday" ${r.type==='Holiday'?'selected':''}>Holiday</option>

     <option value="Off" ${r.type==='Off'?'selected':''}>Off</option>

    </select>

    ${holidayName(dt)?`<div class="muted">${holidayName(dt)}</div>`:''}

   </td>

   <td>
    <input type="time" class="in" value="${r.in||''}">
   </td>

   <td>
    <input type="time" class="out" value="${r.out||''}">
   </td>

   <td class="worked">0 ঘ 0 মি</td>

   <td class="regular">0 ঘ 0 মি</td>

   <td class="ot">0 ঘ 0 মি</td>

  `;

  tb.appendChild(tr);

 }

 // PASSWORD PROTECTION

 document.querySelectorAll('#attendance input[type="time"]').forEach(el=>{

  el.dataset.last=el.value;

  el.addEventListener('change',()=>{

   if(el.dataset.processing)return;

   el.dataset.processing='1';

   let newValue=el.value;

   if(newValue===el.dataset.last){

    el.dataset.processing='';

    return;

   }

   if(!ensurePassword()){

    el.value=el.dataset.last;

    calculate();

    el.dataset.processing='';

    return;

   }

   el.dataset.last=newValue;

   saveCurrentMonth();

   calculate();

   el.dataset.processing='';

  });

 });

 // ATTENDANCE TYPE CHANGE

 document.querySelectorAll('#attendance .typ').forEach(el=>{

  el.addEventListener('change',()=>{

   let dt=el.dataset.date;

   let tr=el.closest('tr');

   let day=new Date(dt+'T12:00:00').getDay();

   if(holidayName(dt)){

    el.value='Holiday';

   }

   tr.classList.remove('sunday','holiday-row');

   if(el.value==='Holiday'){

    tr.classList.add('holiday-row');

   }else if(day===0||el.value==='Sunday'){

    tr.classList.add('sunday');

   }

   saveCurrentMonth();

   calculate();

  });

 });

 calculate();

}

</script>
<script>

// TIME CALCULATION

function getWorkedHours(inTime,outTime){

 if(!inTime||!outTime)return 0;

 let a=inTime.split(':').map(Number);
 let b=outTime.split(':').map(Number);

 if(a.length!==2||b.length!==2)return 0;

 let start=a[0]*60+a[1];
 let end=b[0]*60+b[1];

 if(start===end)return 0;

 let diff=end-start;

 if(diff<0)diff+=1440;

 return diff/60;

}


// SALARY CALCULATION

function calculate(){

 let rs=readRecords();

 let requiredDays=0;
 let total=0;
 let rawOT=0;
 let totalRegular=0;

 let dailyDuty=num('dailyHours');

 for(let [date,r] of Object.entries(rs)){

  let day=new Date(date+'T12:00:00').getDay();

  let type=holidayName(date)
   ?'Holiday'
   :(r.type||defaultType(date,day));

  let hrs=getWorkedHours(r.in,r.out);

  let regular=0;
  let extra=0;

  if(type==='Normal'){

   requiredDays++;

   regular=Math.min(hrs,dailyDuty);

   extra=Math.max(0,hrs-dailyDuty);

  }else if(type==='Sunday'||type==='Holiday'){

   extra=hrs;

  }

  total+=hrs;

  rawOT+=extra;

  totalRegular+=regular;

  let tr=document.querySelector(
   `.typ[data-date="${date}"]`
  )?.closest('tr');

  if(tr){

   tr.querySelector('.worked').textContent=fmtTime(hrs);

   tr.querySelector('.regular').textContent=fmtTime(regular);

   tr.querySelector('.ot').textContent=fmtTime(extra);

  }

 }

 // REQUIRED DUTY HOURS

 let required=requiredDays*dailyDuty;

 // BASIC AND HOURLY RATE

 let salary=num('salary');

 let daily=salary/25;

 let hourly=dailyDuty>0?daily/dailyDuty:0;

 // CL ADJUSTMENT

 let clAdjusted=Math.min(
  Math.max(0,required-total),
  num('clHours')
 );

 let shortfall=Math.max(
  0,
  required-total-clAdjusted
 );

 // FIRST PAYMENT

 let deduction=shortfall*hourly;

 let first=
  salary-
  num('epf')-
  num('mediclaim')-
  num('ptax')-
  deduction;

 // SALARY SUMMARY OT

 let summaryOT=Math.max(
  0,
  total-required
 );

 // SECOND PAYMENT

 let second=summaryOT*hourly;

 // SUMMARY VALUES

 let vals=[

  ['Daily Basic',`₹${daily.toFixed(2)}`],

  ['Hourly Rate',`₹${hourly.toFixed(2)}`],

  ['Normal Working Days',requiredDays],

  ['Required Duty Hours',fmtTime(required)],

  ['Total Worked Hours',fmtTime(total)],

  ['Total Regular Hours',fmtTime(totalRegular)],

  ['Total OT Hours',fmtTime(summaryOT)],

  ['Available CL',fmtTime(num('clHours'))],

  ['CL Adjusted',fmtTime(clAdjusted)],

  ['Shortfall',fmtTime(shortfall)],

  ['1st Payment',`₹${first.toFixed(2)}`],

  ['2nd Payment',`₹${second.toFixed(2)}`],

  ['TOTAL SALARY',`₹${(first+second).toFixed(2)}`]

 ];

 $('summary').innerHTML=vals.map(([k,v])=>`

  <div class="stat">

   <label>${k}</label>

   <b class="${k==='TOTAL SALARY'?'good':''}">
    ${v}
   </b>

  </div>

 `).join('');

}

</script>
<script>

// SAVE DATA

function saveData(){

 calculate();

 saveCurrentMonth();

 saveSettings();

 alert('এই মাসের ডেটা Save হয়েছে।');

}


// EXCEL DOWNLOAD

function exportExcel(){

 try{

  // সর্বশেষ Attendance সংরক্ষণ

  calculate();

  saveCurrentMonth();

  saveSettings();

  let key=displayedMonthKey||monthKey();

  let rs=records[key]||{};

  let yr=Number($('year').value);
  let mo=Number($('month').value);

  let rows=[];

  rows.push([
   'BIVAS SALARY MANAGER'
  ]);

  rows.push([
   'Month',
   months[mo]+' '+yr
  ]);

  rows.push([]);

  rows.push([
   'Date',
   'Day',
   'Type',
   'In Time',
   'Out Time',
   'Worked Hours',
   'Regular Hours',
   'Daily OT'
  ]);

  let totalWorked=0;
  let totalRegular=0;
  let totalDailyOT=0;

  Object.keys(rs).sort().forEach(date=>{

   let r=rs[date];

   let day=new Date(date+'T12:00:00').getDay();

   let type=holidayName(date)
    ?'Holiday'
    :(r.type||defaultType(date,day));

   let worked=getWorkedHours(r.in,r.out);

   let regular=0;
   let ot=0;

   let duty=num('dailyHours');

   if(type==='Normal'){

    regular=Math.min(worked,duty);

    ot=Math.max(0,worked-duty);

   }else if(type==='Sunday'||type==='Holiday'){

    ot=worked;

   }

   totalWorked+=worked;
   totalRegular+=regular;
   totalDailyOT+=ot;

   rows.push([

    date,

    ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][day],

    type,

    r.in||'',

    r.out||'',

    fmtTime(worked),

    fmtTime(regular),

    fmtTime(ot)

   ]);

  });

  rows.push([]);

  rows.push([
   'Total Worked',
   fmtTime(totalWorked)
  ]);

  rows.push([
   'Total Regular',
   fmtTime(totalRegular)
  ]);

  rows.push([
   'Daily Attendance OT',
   fmtTime(totalDailyOT)
  ]);

  let summary=$('summary').innerText;

  rows.push([]);

  rows.push(['SALARY SUMMARY']);

  summary.split('\n').forEach(line=>{

   let t=line.trim();

   if(t)rows.push([t]);

  });

  // CSV GENERATION

  function escapeCSV(value){

   let s=String(value??'');

   return '"'+s.replace(/"/g,'""')+'"';

  }

  let csv='\uFEFF'+rows.map(row=>
   row.map(escapeCSV).join(',')
  ).join('\r\n');

  let blob=new Blob(
   [csv],
   {type:'text/csv;charset=utf-8;'}
  );

  let url=URL.createObjectURL(blob);

  let filename=`BIVAS_SALARY_${key}.csv`;

  let link=document.createElement('a');

  link.href=url;
  link.download=filename;

  document.body.appendChild(link);

  link.click();

  link.remove();

  $('downloadLink').href=url;
  $('downloadLink').download=filename;

  $('downloadFallback').classList.remove('hidden');

  setTimeout(()=>{
   URL.revokeObjectURL(url);
  },60000);

  alert('Excel-এর উপযোগী CSV ফাইল তৈরি হয়েছে।');

 }catch(e){

  console.error(e);

  alert('Excel Download করতে সমস্যা হয়েছে: '+e.message);

 }

}


// BACKUP

function backup(){

 saveCurrentMonth();

 saveSettings();

 let data={

  records:records,

  holidays:holidays,

  monthSettings:monthSettings,

  currentSettings:settingsObject()

 };

 let blob=new Blob(
  [JSON.stringify(data,null,2)],
  {type:'application/json'}
 );

 let url=URL.createObjectURL(blob);

 let a=document.createElement('a');

 a.href=url;

 a.download='BIVAS_SALARY_BACKUP.json';

 document.body.appendChild(a);

 a.click();

 a.remove();

 setTimeout(()=>URL.revokeObjectURL(url),60000);

 alert('Backup তৈরি হয়েছে।');

}

</script>
<script>

// RESTORE BACKUP

function restore(event){

 let file=event.target.files[0];

 if(!file)return;

 let reader=new FileReader();

 reader.onload=function(){

  try{

   let data=JSON.parse(reader.result);

   if(!data.records){
    throw new Error('Invalid backup');
   }

   records=data.records||{};

   holidays=data.holidays||[];

   monthSettings=data.monthSettings||{};

   localStorage.setItem(
    'bivas-records',
    JSON.stringify(records)
   );

   localStorage.setItem(
    'bivas-holidays',
    JSON.stringify(holidays)
   );

   localStorage.setItem(
    'bivas-month-settings',
    JSON.stringify(monthSettings)
   );

   if(data.currentSettings){

    localStorage.setItem(
     'bivas-current-settings',
     JSON.stringify(data.currentSettings)
    );

   }

   alert('Backup Restore হয়েছে।');

   location.reload();

  }catch(e){

   alert('Backup File সঠিক নয়।');

  }

 };

 reader.readAsText(file);

 event.target.value='';

}


// ADD HOLIDAY

function addHoliday(){

 let d=$('holidayDate').value;

 let n=$('holidayName').value.trim();

 if(!d){

  alert('Holiday Date নির্বাচন করুন।');

  return;

 }

 holidays=holidays.filter(x=>x.date!==d);

 holidays.push({

  date:d,

  name:n||'Holiday'

 });

 updateHolidayTypes(d,true);

 localStorage.setItem(
  'bivas-holidays',
  JSON.stringify(holidays)
 );

 renderHolidayList();

 if(d.slice(0,7)===monthKey()){

  renderMonth();

 }

 $('holidayName').value='';

}


// UPDATE HOLIDAY TYPE

function updateHolidayTypes(date,adding){

 let y=Number(date.slice(0,4));

 let m=Number(date.slice(5,7))-1;

 let d=Number(date.slice(8,10));

 let day=new Date(y,m,d).getDay();

 let k=date.slice(0,7);

 records[k]=records[k]||{};

 let r=records[k][date]||{

  in:'',

  out:'',

  type:'Normal'

 };

 if(adding){

  r.type='Holiday';

 }else if(r.type==='Holiday'){

  r.type=day===0?'Sunday':'Normal';

 }

 records[k][date]=r;

 localStorage.setItem(
  'bivas-records',
  JSON.stringify(records)
 );

}


// REMOVE HOLIDAY

function removeHoliday(d){

 holidays=holidays.filter(x=>x.date!==d);

 updateHolidayTypes(d,false);

 localStorage.setItem(
  'bivas-holidays',
  JSON.stringify(holidays)
 );

 renderHolidayList();

 if(d.slice(0,7)===monthKey()){

  renderMonth();

 }

}


// HOLIDAY LIST

function renderHolidayList(){

 $('holidayList').innerHTML='';

 holidays.sort((a,b)=>a.date.localeCompare(b.date));

 holidays.forEach(h=>{

  let div=document.createElement('div');

  div.className='holiday';

  div.textContent=h.date+' — '+h.name+' ';

  let btn=document.createElement('button');

  btn.className='danger';

  btn.textContent='মুছুন';

  btn.onclick=()=>removeHoliday(h.date);

  div.appendChild(btn);

  $('holidayList').appendChild(div);

 });

}

</script>
<script>
function showHistory(){
  let box=$('historyList');
  if(!box)return;

  let keys=Object.keys(records).sort().reverse();

  if(!keys.length){
    box.innerHTML='<p>কোনো Previous Month Data নেই।</p>';
    return;
  }

  box.innerHTML='';

  keys.forEach(key=>{
    let data=records[key]||{};
    let worked=0;

    Object.values(data).forEach(item=>{
      if(item && item.in && item.out){
        worked+=getWorkedHours(item.in,item.out);
      }
    });

    let [year,month]=key.split('-');
    let monthName=new Date(Number(year),Number(month)-1,1)
      .toLocaleString('en-IN',{month:'long',year:'numeric'});

    let div=document.createElement('div');
    div.className='history-item';
    div.innerHTML=`
      <strong>${monthName}</strong>
      <span>Total Worked: ${formatHours(worked)}</span>
      <button type="button" onclick="viewHistory('${key}')">
        View
      </button>
    `;
    box.appendChild(div);
  });
}

function viewHistory(key){
  let data=records[key]||{};
  let [year,month]=key.split('-');

  let oldMonth=$('month').value;
  let oldYear=$('year').value;

  $('month').value=Number(month);
  $('year').value=Number(year);

  renderMonth();
  records[key]=data;
  saveData();

  alert('Previous month data loaded. Current month change korte month/year abar select korun.');
}

function saveCurrentMonth(){
  let key=currentKey();
  records[key]=readRecords();
  localStorage.setItem('bivas_records',JSON.stringify(records));
}

function saveSettings(){
  let key=currentKey();

  monthSettings[key]={
    basic:$('basicSalary').value,
    duty:$('dutyHours').value
  };

  localStorage.setItem('bivas_month_settings',
    JSON.stringify(monthSettings));

  localStorage.setItem('bivas_current_settings',
    JSON.stringify({
      basic:$('basicSalary').value,
      duty:$('dutyHours').value
    }));
}

function changeMonth(){
  saveCurrentMonth();
  saveSettings();
  renderMonth();
  calculate();
  showHistory();
}

$('month').addEventListener('change',changeMonth);
$('year').addEventListener('change',changeMonth);

$('basicSalary').addEventListener('input',()=>{
  saveSettings();
  calculate();
});

$('dutyHours').addEventListener('input',()=>{
  saveSettings();
  calculate();
});

$('holidayDate').addEventListener('change',()=>{
  // Holiday date selection only; add button handles saving.
});

</script>
