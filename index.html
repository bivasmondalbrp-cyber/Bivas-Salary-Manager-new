}

padding:10px;

background:white;
}

border:0;
border-radius:8px;
padding:11px 13px;

}

button.danger{
background:#b42318;
}

.stat{

border-radius:8px;
padding:10px;
}

.stat b{
display:block;
font-size:17px;
margin-top:5px;
}

display:flex;
gap:8px;
align-items:end;
flex-wrap:wrap;
}

.row>*{
flex:1;
min-width:100px;
}

.tablewrap{
overflow-x:auto;
}

table{
border-collapse:collapse;
width:100%;
font-size:12px;

text-align:left;

.bad{color:var(--red)}

<script>

const $=id=>document.getElementById(id);

const months=[
'January','February','March','April',
'May','June','July','August',
'September','October','November','December'
];

const SET_KEYS=[
'salary','dailyHours','clHours',
'epf','mediclaim','ptax'
];

let records={};
let holidays=[];
let monthSettings={};
let displayedMonthKey=null;

function monthKey(){

 return `${$('year').value}-${String(+$('month').value+1).padStart(2,'0')}`;

}

function num(id){

 return Math.max(0,Number($(id).value)||0);

}

function dateKey(y,m,d){

 return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

}

function settingsObject(){

 let s={};

 SET_KEYS.forEach(k=>s[k]=$(k).value);

 return s;

}

function saveSettings(){

 monthSettings[monthKey()]=settingsObject();

 localStorage.setItem(
  'bivas-month-settings',
  JSON.stringify(monthSettings)
 );

 localStorage.setItem(
  'bivas-current-settings',
  JSON.stringify(settingsObject())
 );

}

function applyMonthSettings(k){

 let s=monthSettings[k];

 if(s){

  SET_KEYS.forEach(x=>{

   if(s[x]!==undefined){

    $(x).value=s[x];

   }

  });

 }

}

function fmtTime(hours){

 let mins=Math.round(Math.max(0,hours)*60);

 return `${Math.floor(mins/60)} ঘ ${mins%60} মি`;

}


// PASSWORD SYSTEM

function hashPassword(p){

 let h=2166136261;

 for(let i=0;i<p.length;i++){

  h^=p.charCodeAt(i);

  h=Math.imul(h,16777619);

 }

 return (h>>>0).toString(16);

}

function ensurePassword(){

 let stored=localStorage.getItem('bivas-time-password');

 if(!stored){

  let p=prompt('নতুন Password তৈরি করুন:');

  if(!p)return false;

  if(p.length<4){

   alert('কমপক্ষে ৪ অক্ষরের Password দিন।');

   return false;

  }

  localStorage.setItem(
   'bivas-time-password',
   hashPassword(p)
  );

  return true;

 }

 let p=prompt('Password দিন:');

 if(p===null)return false;

 if(hashPassword(p)!==stored){

  alert('ভুল Password।');

  return false;

 }

 return true;

}

function changePassword(){

 let old=localStorage.getItem('bivas-time-password');

 if(old){

  let p=prompt('বর্তমান Password দিন:');

  if(p===null||hashPassword(p)!==old){

   alert('বর্তমান Password সঠিক নয়।');

   return;

  }

 }

 let n=prompt('নতুন Password দিন:');

 if(!n||n.length<4){

  alert('কমপক্ষে ৪ অক্ষরের Password দিন।');

  return;

 }

 localStorage.setItem(
  'bivas-time-password',
  hashPassword(n)
 );

 alert('Password পরিবর্তন হয়েছে।');

}

             </script>

function getWorkedHours(inTime,outTime){

 if(!inTime||!outTime)return 0;

 let a=inTime.split(':').map(Number);
 let b=outTime.split(':').map(Number);

 if(a.length!==2||b.length!==2)return 0;

 let start=a[0]*60+a[1];
 let end=b[0]*60+b[1];

 if(start===end)return 0;

 let diff=end-start;

 if(diff<0)diff+=1440;

 return diff/60;

}

  }

  alert('ভুল Password।');

  return false;

 }

 return true;

}

function changePassword(){

 let old=localStorage.getItem('bivas-time-password');

 if(old){

  let p=prompt('বর্তমান Password দিন:');

  if(p===null||hashPassword(p)!==old){

   alert('বর্তমান Password সঠিক নয়।');

   return;

  }

 }

 let n=prompt('নতুন Password দিন:');

 if(!n||n.length<4){

  alert('কমপক্ষে ৪ অক্ষরের Password দিন।');

  return;

 }

 localStorage.setItem(
  'bivas-time-password',
  hashPassword(n)
 );

 alert('Password পরিবর্তন হয়েছে।');

}

</script>
<script>
/* ===== PART 3: MONTH CALENDAR & ATTENDANCE ===== */

function getEl(...ids){
  for(const id of ids){
    const el=document.getElementById(id);
    if(el) return el;
  }
  return null;
}

function escapeHTML(value){
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[ch]));
}

function holidayName(key){
  if(!Array.isArray(holidays)) return '';
  const found=holidays.find(h=>{
    if(typeof h==='string') return h===key;
    return h && (h.date===key || h.key===key);
  });
  if(!found) return '';
  return typeof found==='string' ? 'Holiday' : (found.name || 'Holiday');
}

function defaultType(key){
  if(holidayName(key)) return 'Holiday';

  const d=new Date(key+'T00:00:00');
  if(d.getDay()===0) return 'Sunday';

  return 'Normal';
}

/* Current table থেকে একটি মাসের সব entry সংগ্রহ */
function readRecords(key){
  if(!key) return;

  const body=getEl('attendanceBody','attendanceTableBody','dailyAttendanceBody');
  if(!body) return;

  const monthData={};

  body.querySelectorAll('tr[data-date]').forEach(row=>{
    const date=row.dataset.date;
    const type=row.querySelector('.work-type')?.value || defaultType(date);
    const inTime=row.querySelector('.in-time')?.value || '';
    const outTime=row.querySelector('.out-time')?.value || '';

    monthData[date]={
      type:type,
      in:inTime,
      out:outTime
    };
  });

  records[key]=monthData;
  localStorage.setItem('bivas-records',JSON.stringify(records));
}

/* বর্তমান মাসের তথ্য সংরক্ষণ */
function saveCurrentMonth(){
  if(!displayedMonthKey) return;

  readRecords(displayedMonthKey);
  saveSettings();
}

/* মাসের প্রতিটি তারিখের Attendance Table তৈরি */
function renderMonth(){
  const yearEl=getEl('year','yearSelect','attendanceYear');
  const monthEl=getEl('month','monthSelect','attendanceMonth');
  const body=getEl('attendanceBody','attendanceTableBody','dailyAttendanceBody');

  if(!yearEl || !monthEl || !body) return;

  const year=parseInt(yearEl.value,10);
  const month=parseInt(monthEl.value,10);

  if(!Number.isFinite(year) || !Number.isFinite(month)) return;

  const targetKey=year+'-'+String(month).padStart(2,'0');

  /* আগের মাসের তথ্য আগে সংরক্ষণ */
  if(displayedMonthKey && displayedMonthKey!==targetKey){
    saveCurrentMonth();
  }

  displayedMonthKey=targetKey;
  applyMonthSettings(targetKey);

  const saved=records[targetKey] || {};
  const daysInMonth=new Date(year,month,0).getDate();

  let html='';

  for(let day=1;day<=daysInMonth;day++){
    const date=dateKey(year,month,day);
    const old=saved[date] || {};

    const type=old.type || defaultType(date);
    const inTime=old.in || '';
    const outTime=old.out || '';

    html+=`
      <tr data-date="${date}">
        <td>${day}</td>
        <td>${new Date(year,month-1,day).toLocaleDateString('en-IN',{
          weekday:'short'
        })}</td>

        <td>
          <select class="work-type">
            <option value="Normal" ${type==='Normal'?'selected':''}>Normal</option>
            <option value="Sunday" ${type==='Sunday'?'selected':''}>Sunday</option>
            <option value="Holiday" ${type==='Holiday'?'selected':''}>Holiday</option>
            <option value="Off" ${type==='Off'?'selected':''}>Off</option>
            <option value="CL" ${type==='CL'?'selected':''}>CL</option>
          </select>
        </td>

        <td>
          <input class="in-time" type="time"
            value="${escapeHTML(inTime)}">
        </td>

        <td>
          <input class="out-time" type="time"
            value="${escapeHTML(outTime)}">
        </td>

        <td class="worked-cell">0h 00m</td>
        <td class="regular-cell">0h 00m</td>
        <td class="ot-cell">0h 00m</td>
      </tr>
    `;
  }

  body.innerHTML=html;

  /* Entry পরিবর্তন হলে সঙ্গে সঙ্গে হিসাব ও Save */
  body.querySelectorAll('tr[data-date]').forEach(row=>{
    row.querySelectorAll('select,input').forEach(input=>{
      input.addEventListener('change',()=>{
        readRecords(displayedMonthKey);

        if(typeof calculate==='function') calculate();
        if(typeof saveData==='function') saveData();
      });
    });
  });

  if(typeof calculate==='function') calculate();
  if(typeof renderHolidayList==='function') renderHolidayList();
}

/* Holiday List পরিবর্তন হলে সংশ্লিষ্ট তারিখের Type আপডেট */
function updateHolidayTypes(){
  if(!displayedMonthKey) return;

  const body=getEl('attendanceBody','attendanceTableBody','dailyAttendanceBody');
  if(!body) return;

  body.querySelectorAll('tr[data-date]').forEach(row=>{
    const date=row.dataset.date;
    const select=row.querySelector('.work-type');

    if(!select) return;

    const name=holidayName(date);

    if(name){
      select.value='Holiday';
    }else if(select.value==='Holiday'){
      const d=new Date(date+'T00:00:00');
      select.value=d.getDay()===0?'Sunday':'Normal';
    }
  });

  readRecords(displayedMonthKey);

  if(typeof calculate==='function') calculate();
  if(typeof saveData==='function') saveData();
}

/* ===== END PART 3 ===== */
</script>
<script>

/* ===== PART 4: SALARY CALCULATION ===== */

function getWorkedHours(inTime,outTime){

 if(!inTime||!outTime)return 0;

 let a=inTime.split(':').map(Number);
 let b=outTime.split(':').map(Number);

 let start=a[0]*60+a[1];
 let end=b[0]*60+b[1];

 if(start===end)return 0;

 let diff=end-start;

 if(diff<0)diff+=1440;

 return diff/60;

}


function calculate(){

 let key=displayedMonthKey||monthKey();

 let rs=records[key]||{};

 let requiredDays=0;
 let totalWorked=0;
 let totalRegular=0;
 let dailyOT=0;

 let dailyDuty=num('dailyHours');

 for(let [date,r] of Object.entries(rs)){

  let type=holidayName(date)
   ?'Holiday'
   :(r.type||defaultType(date));

  let worked=getWorkedHours(r.in,r.out);

  let regular=0;
  let extra=0;

  if(type==='Normal'){

   requiredDays++;

   regular=Math.min(worked,dailyDuty);

   extra=Math.max(0,worked-dailyDuty);

  }else if(type==='Sunday'||type==='Holiday'){

   extra=worked;

  }

  totalWorked+=worked;
  totalRegular+=regular;
  dailyOT+=extra;

  let row=document.querySelector(
   `tr[data-date="${date}"]`
  );

  if(row){

   let w=row.querySelector('.worked-cell');
   let rg=row.querySelector('.regular-cell');
   let ot=row.querySelector('.ot-cell');

   if(w)w.textContent=fmtTime(worked);
   if(rg)rg.textContent=fmtTime(regular);
   if(ot)ot.textContent=fmtTime(extra);

  }

 }

 // REQUIRED DUTY HOURS

 let required=requiredDays*dailyDuty;

 // SALARY

 let salary=num('salary');

 let dailyBasic=salary/25;

 let hourlyRate=dailyDuty>0
  ?dailyBasic/dailyDuty
  :0;

 // SUMMARY OT
 // Required hours পূর্ণ না হলে OT শূন্য

 let summaryOT=Math.max(
  0,
  totalWorked-required
 );

 // CL ADJUSTMENT

 let clAdjusted=Math.min(
  Math.max(0,required-totalWorked),
  num('clHours')
 );

 let shortfall=Math.max(
  0,
  required-totalWorked-clAdjusted
 );

 // FIRST PAYMENT

 let deduction=shortfall*hourlyRate;

 let firstPayment=
  salary-
  num('epf')-
  num('mediclaim')-
  num('ptax')-
  deduction;

 // SECOND PAYMENT

 let secondPayment=summaryOT*hourlyRate;

 // TOTAL

 let totalSalary=firstPayment+secondPayment;

 // SUMMARY

 let vals=[

  ['Daily Basic',`₹${dailyBasic.toFixed(2)}`],

  ['Hourly Rate',`₹${hourlyRate.toFixed(2)}`],

  ['Normal Working Days',requiredDays],

  ['Required Duty Hours',fmtTime(required)],

  ['Total Worked Hours',fmtTime(totalWorked)],

  ['Total Regular Hours',fmtTime(totalRegular)],

  ['Daily Attendance OT',fmtTime(dailyOT)],

  ['Salary Summary OT',fmtTime(summaryOT)],

  ['Available CL',fmtTime(num('clHours'))],

  ['CL Adjusted',fmtTime(clAdjusted)],

  ['Shortfall',fmtTime(shortfall)],

  ['1st Payment',`₹${firstPayment.toFixed(2)}`],

  ['2nd Payment',`₹${secondPayment.toFixed(2)}`],

  ['TOTAL SALARY',`₹${totalSalary.toFixed(2)}`]

 ];

 $('summary').innerHTML=vals.map(([k,v])=>`

  <div class="stat">

   <label>${k}</label>

   <b class="${k==='TOTAL SALARY'?'good':''}">
    ${v}
   </b>

  </div>

 `).join('');

}


/* SAVE DATA */

function saveData(){

 if(displayedMonthKey){
  readRecords(displayedMonthKey);
 }

 saveSettings();

 localStorage.setItem(
  'bivas-records',
  JSON.stringify(records)
 );

 if(typeof calculate==='function'){
  calculate();
 }

}


/* ===== END PART 4 ===== */

</script>
<script>

/* ===== PART 5: EXCEL EXPORT ===== */

function exportExcel(){

 try{

  saveCurrentMonth();
  calculate();

  const key=displayedMonthKey||monthKey();
  const rs=records[key]||{};

  const [year,month]=key.split('-');

  let rows=[];

  rows.push(['BIVAS SALARY MANAGER']);
  rows.push(['Month',months[Number(month)-1]+' '+year]);
  rows.push([]);

  rows.push([
   'Date','Day','Type',
   'In Time','Out Time',
   'Worked','Regular','Daily OT'
  ]);

  let total=0;
  let regularTotal=0;
  let otTotal=0;

  Object.keys(rs).sort().forEach(date=>{

   let r=rs[date];

   let day=new Date(date+'T12:00:00').getDay();

   let type=holidayName(date)
    ?'Holiday'
    :(r.type||defaultType(date));

   let worked=getWorkedHours(r.in,r.out);

   let regular=0;
   let ot=0;

   let duty=num('dailyHours');

   if(type==='Normal'){

    regular=Math.min(worked,duty);
    ot=Math.max(0,worked-duty);

   }else if(type==='Sunday'||type==='Holiday'){

    ot=worked;

   }

   total+=worked;
   regularTotal+=regular;
   otTotal+=ot;

   rows.push([
    date,
    ['Sunday','Monday','Tuesday','Wednesday',
     'Thursday','Friday','Saturday'][day],
    type,
    r.in||'',
    r.out||'',
    fmtTime(worked),
    fmtTime(regular),
    fmtTime(ot)
   ]);

  });

  rows.push([]);
  rows.push(['Total Worked',fmtTime(total)]);
  rows.push(['Total Regular',fmtTime(regularTotal)]);
  rows.push(['Daily Attendance OT',fmtTime(otTotal)]);

  rows.push([]);
  rows.push(['SALARY SUMMARY']);

  let summary=$('summary').innerText;

  summary.split('\n').forEach(line=>{
   let t=line.trim();
   if(t)rows.push([t]);
  });

  function escapeCSV(value){
   return '"'+String(value??'').replace(/"/g,'""')+'"';
  }

  let csv='\uFEFF'+rows.map(row=>
   row.map(escapeCSV).join(',')
  ).join('\r\n');

  let blob=new Blob(
   [csv],
   {type:'text/csv;charset=utf-8;'}
  );

  let url=URL.createObjectURL(blob);

  let filename=`BIVAS_SALARY_${key}.csv`;

  let a=document.createElement('a');

  a.href=url;
  a.download=filename;

  document.body.appendChild(a);
  a.click();
  a.remove();

  $('downloadLink').href=url;
  $('downloadLink').download=filename;
  $('downloadFallback').classList.remove('hidden');

 }catch(e){

  alert('Excel Download সমস্যা: '+e.message);
  console.error(e);

 }

}


/* ===== BACKUP ===== */

function backup(){

 saveCurrentMonth();

 let data={
  records:records,
  holidays:holidays,
  monthSettings:monthSettings,
  currentSettings:settingsObject()
 };

 let blob=new Blob(
  [JSON.stringify(data,null,2)],
  {type:'application/json'}
 );

 let url=URL.createObjectURL(blob);

 let a=document.createElement('a');

 a.href=url;
 a.download='BIVAS_SALARY_BACKUP.json';

 document.body.appendChild(a);
 a.click();
 a.remove();

 setTimeout(()=>URL.revokeObjectURL(url),60000);

}


/* ===== RESTORE ===== */

function restore(event){

 let file=event.target.files[0];

 if(!file)return;

 let reader=new FileReader();

 reader.onload=function(){

  try{

   let data=JSON.parse(reader.result);

   if(!data.records)throw new Error('Invalid backup');

   records=data.records||{};
   holidays=data.holidays||[];
   monthSettings=data.monthSettings||{};

   localStorage.setItem(
    'bivas-records',
    JSON.stringify(records)
   );

   localStorage.setItem(
    'bivas-holidays',
    JSON.stringify(holidays)
   );

   localStorage.setItem(
    'bivas-month-settings',
    JSON.stringify(monthSettings)
   );

   if(data.currentSettings){

    localStorage.setItem(
     'bivas-current-settings',
     JSON.stringify(data.currentSettings)
    );

   }

   alert('Backup Restore হয়েছে।');

   location.reload();

  }catch(e){

   alert('Backup File সঠিক নয়।');

  }

 };

 reader.readAsText(file);

 event.target.value='';

}


/* ===== END PART 5 ===== */

</script>
<script>

/* ===== PART 6: HOLIDAY LIST ===== */

function addHoliday(){

 let d=$('holidayDate').value;
 let n=$('holidayName').value.trim();

 if(!d){
  alert('Holiday Date নির্বাচন করুন।');
  return;
 }

 if(!Array.isArray(holidays))holidays=[];

 holidays=holidays.filter(x=>x.date!==d);

 holidays.push({
  date:d,
  name:n||'Holiday'
 });

 localStorage.setItem(
  'bivas-holidays',
  JSON.stringify(holidays)
 );

 updateHolidayTypes();

 renderHolidayList();

 $('holidayName').value='';

}

function removeHoliday(d){

 holidays=holidays.filter(x=>x.date!==d);

 localStorage.setItem(
  'bivas-holidays',
  JSON.stringify(holidays)
 );

 updateHolidayTypes();

 renderHolidayList();

}

function renderHolidayList(){

 $('holidayList').innerHTML='';

 holidays.sort((a,b)=>a.date.localeCompare(b.date));

 holidays.forEach(h=>{

  let div=document.createElement('div');

  div.className='holiday';

  div.textContent=h.date+' — '+h.name+' ';

  let btn=document.createElement('button');

  btn.className='danger';
  btn.textContent='মুছুন';

  btn.onclick=()=>removeHoliday(h.date);

  div.appendChild(btn);

  $('holidayList').appendChild(div);

 });

}


/* ===== PREVIOUS MONTH HISTORY ===== */

function showHistory(){

 let y=Number($('historyYear').value);
 let m=Number($('historyMonth').value);

 let key=`${y}-${String(m+1).padStart(2,'0')}`;

 let data=records[key]||{};

 let cfg=monthSettings[key]||{};

 let duty=Number(cfg.dailyHours||9);

 let total=0;
 let ot=0;
 let days=0;

 Object.entries(data).forEach(([date,r])=>{

  let type=holidayName(date)
   ?'Holiday'
   :(r.type||defaultType(date));

  let worked=getWorkedHours(r.in,r.out);

  if(type==='Normal'){

   days++;

   ot+=Math.max(0,worked-duty);

  }else if(type==='Sunday'||type==='Holiday'){

   ot+=worked;

  }

  total+=worked;

 });

 $('historyResult').textContent=
  `${months[m]} ${y} | `+
  `Worked: ${fmtTime(total)} | `+
  `Required: ${fmtTime(days*duty)} | `+
  `OT: ${fmtTime(ot)} | `+
  `Basic Salary: ₹${cfg.salary||0}`;

}


/* ===== MONTH CHANGE ===== */

function changeMonth(){

 saveCurrentMonth();

 let y=Number($('year').value);
 let m=Number($('month').value);

 if(!Number.isInteger(y)||y<2000||y>2100||
    !Number.isInteger(m)||m<0||m>11){
  return;
 }

 renderMonth();

 calculate();

}


/* ===== SETTINGS SAVE ===== */

SET_KEYS.forEach(k=>{

 $(k).addEventListener('input',()=>{

  saveSettings();

  calculate();

 });

 $(k).addEventListener('change',()=>{

  saveSettings();

  calculate();

 });

});


/* ===== MONTH/YEAR EVENTS ===== */

$('year').addEventListener('change',changeMonth);

$('month').addEventListener('change',changeMonth);


/* ===== APPLICATION INIT ===== */

function init(){

 try{

  records=JSON.parse(
   localStorage.getItem('bivas-records')||'{}'
  );

  holidays=JSON.parse(
   localStorage.getItem('bivas-holidays')||'[]'
  );

  monthSettings=JSON.parse(
   localStorage.getItem('bivas-month-settings')||'{}'
  );

 }catch(e){

  records={};
  holidays=[];
  monthSettings={};

 }

 let now=new Date();

 $('year').value=now.getFullYear();
 $('month').value=now.getMonth();

 $('historyYear').value=now.getFullYear();
 $('historyMonth').value=now.getMonth();

 let key=monthKey();

 if(monthSettings[key]){

  applyMonthSettings(key);

 }else{

  let saved=JSON.parse(
   localStorage.getItem('bivas-current-settings')||'null'
  );

  if(saved){

   Object.entries(saved).forEach(([id,value])=>{

    if($(id))$(id).value=value;

   });

  }

 }

 renderHolidayList();

 renderMonth();

 calculate();

}


/* START ONLY ONCE */

init();

</script>
