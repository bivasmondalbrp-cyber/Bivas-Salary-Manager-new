<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123c69">
<title>BIVAS SALARY MANAGER</title>

<style>
:root {
 --blue:#123c69;
 --bg:#f2f5f9;
 --green:#147d54;
 --red:#b42318;
}
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,'Noto Sans Bengali',sans-serif;
 background:var(--bg);
 color:#17212b;
}
header{
 background:var(--blue);
 color:white;
 padding:18px;
 font-size:21px;
 font-weight:bold;
}
.wrap{
 max-width:1000px;
 margin:auto;
 padding:12px;
}
.card{
 background:white;
 padding:15px;
 border-radius:12px;
 margin:12px 0;
 box-shadow:0 2px 8px #13243a12;
}
h2{
 color:var(--blue);
 font-size:17px;
 margin:0 0 13px;
}
h3{font-size:15px}
.grid{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:10px;
}
label{
 display:block;
 font-size:13px;
 margin-bottom:5px;
 color:#455468;
}
input,select,textarea,button{
 font:inherit;
}
input,select,textarea{
 width:100%;
 padding:10px;
 border:1px solid #cbd5e1;
 border-radius:8px;
 background:white;
}
button{
 border:0;
 border-radius:8px;
 padding:11px 13px;
 background:var(--blue);
 color:white;
 font-weight:600;
 margin:4px 3px 4px 0;
 cursor:pointer;
}
.secondary{
 background:#e4ebf3;
 color:#18324e;
}
.danger{background:var(--red)}
.green{background:var(--green)}
.stat{
 background:#f4f7fb;
 padding:11px;
 border-radius:9px;
}
.stat b{
 display:block;
 font-size:17px;
 margin-top:6px;
}
.row{
 display:flex;
 gap:9px;
 flex-wrap:wrap;
 align-items:end;
}
.row>*{flex:1;min-width:110px}
.tablewrap{overflow-x:auto}
table{
 width:100%;
 border-collapse:collapse;
 font-size:12px;
 min-width:780px;
}
th,td{
 border-bottom:1px solid #e3e8ef;
 padding:8px;
 text-align:left;
}
th{background:#edf2f8}
td input,td select{min-width:100px;padding:7px}
.muted{font-size:12px;color:#667085;line-height:1.5}
.hidden{display:none!important}
.good{color:var(--green)}
.bad{color:var(--red)}
.notice{
 padding:10px;
 background:#fff7e6;
 color:#754c00;
 border-radius:8px;
 font-size:13px;
}
.holiday{
 padding:7px;
 border-bottom:1px solid #eee;
 font-size:13px;
}
.sunday td{background:#e8f5e9}
.holiday-row td{background:#fff0dc}
.nav{
 display:flex;
 flex-wrap:wrap;
 gap:4px;
}
.nav button{font-size:12px}
@media(max-width:420px){
 .grid{grid-template-columns:1fr 1fr}
 .stat b{font-size:14px}
}
@media print{
 header,.no-print,button{display:none!important}
 body{background:white}
 .card{box-shadow:none;break-inside:avoid}
}
</style>
</head>

<body>
<header>BIVAS SALARY MANAGER</header>

<main class="wrap">

<div class="card no-print">
 <div class="nav">
  <button onclick="go('profile')">My Profile</button>
  <button onclick="go('dashboard')">Dashboard</button>
  <button onclick="go('attendanceSection')">Attendance</button>
  <button onclick="go('salarySection')">Salary</button>
  <button onclick="go('backupSection')">Backup</button>
 </div>
</div>
<section class="card" id="profile">
<h2>My Profile</h2>

<div class="grid">
 <div>
  <label>Employee Name</label>
  <input id="employeeName" placeholder="আপনার নাম">
 </div>
 <div>
  <label>Employee ID</label>
  <input id="employeeId" placeholder="Employee ID">
 </div>
 <div>
  <label>Designation</label>
  <input id="designation" placeholder="পদবি">
 </div>
 <div>
  <label>Company Name</label>
  <input id="companyName" placeholder="কোম্পানির নাম">
 </div>
 <div>
  <label>Mobile Number</label>
  <input id="mobile" type="tel">
 </div>
 <div>
  <label>Joining Date</label>
  <input id="joiningDate" type="date">
 </div>
</div>

<button onclick="saveProfile()">Profile Save</button>
</section>

<section class="card" id="dashboard">
<h2>Dashboard</h2>
<div class="grid" id="dashboardStats"></div>
</section>

<section class="card" id="attendanceSection">
<h2>দৈনিক Attendance Entry</h2>

<div class="tablewrap">
<table>
<thead>
<tr>
<th>তারিখ</th>
<th>দিন</th>
<th>ধরন</th>
<th>In Time</th>
<th>Out Time</th>
<th>Worked</th>
<th>Regular</th>
<th>OT</th>
</tr>
</thead>
<tbody id="attendance"></tbody>
</table>
</div>
</section>
<section class="card" id="salarySection">
<h2>মাস ও বেতনের সেটিংস</h2>

<div class="grid">
 <div>
  <label>বছর</label>
  <input id="year" type="number" value="2026">
 </div>
 <div>
  <label>মাস</label>
  <select id="month">
   <option value="0">January</option>
   <option value="1">February</option>
   <option value="2">March</option>
   <option value="3">April</option>
   <option value="4">May</option>
   <option value="5">June</option>
   <option value="6">July</option>
   <option value="7">August</option>
   <option value="8">September</option>
   <option value="9">October</option>
   <option value="10">November</option>
   <option value="11">December</option>
  </select>
 </div>
 <div>
  <label>Monthly Basic Salary (₹)</label>
  <input id="salary" type="number" value="23625">
 </div>

  <input id="epf" type="number" value="1417.50">

<button onclick="saveData()">ডেটা Save</button>

<h2 style="margin-top:20px">Salary Summary</h2>
<div class="grid" id="summary"></div>

<div class="no-print">

</div>
</section>

 <section class="card" id="holidaySection">
<h2>Holiday List</h2>

<div class="row">
 <div>
  <label>Holiday Date</label>
  <input id="holidayDate" type="date">
 </div>

  <label>Holiday Name</label>
  <input id="holidayName" placeholder="Puja Holiday">

</div>

</section>

<section class="card" id="historySection">
<h2>Salary History</h2>

<div class="grid">

  <input id="historyYear" type="number">
 </div>
 <div>
  <label>মাস</label>
  <select id="historyMonth">
   <option value="0">January</option>
   <option value="1">February</option>
   <option value="2">March</option>
   <option value="3">April</option>
   <option value="4">May</option>
   <option value="5">June</option>
   <option value="6">July</option>
   <option value="7">August</option>
   <option value="8">September</option>
   <option value="9">October</option>
   <option value="10">November</option>

 </div>

<button onclick="showHistory()">হিসাব দেখুন</button>

 <section class="card" id="backupSection">
<h2>Backup ও Restore</h2>
<button onclick="backup()">Backup Download</button>
<button class="secondary" onclick="$('restorePick').click()">Restore Backup</button>
<input id="restorePick" class="hidden" type="file"
 accept=".json,application/json" onchange="restore(event)">
<p class="muted">Backup ফাইল নিরাপদ স্থানে রাখুন।</p>

<div id="autoBackupStatus" class="muted"></div>
<button class="secondary" onclick="autoBackup()">এখনই Local Backup</button>

<h2>Notification & Reminder</h2>
<button class="secondary" onclick="enableNotifications()">Notification চালু করুন</button>
<button class="secondary" onclick="scheduleReminder()">Reminder সেট করুন</button>
</section>

<script>
const $=id=>document.getElementById(id);
const months=['January','February','March','April','May','June',
'July','August','September','October','November','December'];

const SET_KEYS=['salary','dailyHours','clHours','epf','mediclaim','ptax'];

let records={};
let holidays=[];
let monthSettings={};
let profile={};
let displayedMonthKey=null;

function monthKey(){
 return `${$('year').value}-${String(+$('month').value+1).padStart(2,'0')}`;
}
function num(id){return Math.max(0,Number($(id).value)||0);}
function dateKey(y,m,d){
 return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function fmtTime(h){
 let n=Math.round(Math.max(0,h)*60);
 return `${Math.floor(n/60)} ঘ ${n%60} মি`;
}
function getWorkedHours(a,b){
 if(!a||!b)return 0;
 let x=a.split(':').map(Number);
 let y=b.split(':').map(Number);
 let s=x[0]*60+x[1],e=y[0]*60+y[1];
 if(s===e)return 0;
 if(e<s)e+=1440;
 return (e-s)/60;
}
function settingsObject(){
 let s={};
 SET_KEYS.forEach(k=>s[k]=$(k).value);
 return s;
}
function saveSettings(){
 monthSettings[monthKey()]=settingsObject();
 localStorage.setItem('bivas-month-settings',JSON.stringify(monthSettings));
 localStorage.setItem('bivas-current-settings',JSON.stringify(settingsObject()));
}
function applyMonthSettings(k){
 let s=monthSettings[k];
 if(s)SET_KEYS.forEach(x=>{if(s[x]!==undefined)$(x).value=s[x];});
}
function saveProfile(){
 profile={};
 ['employeeName','employeeId','designation','companyName','mobile','joiningDate']
 .forEach(k=>profile[k]=$(k).value);
 localStorage.setItem('bivas-profile',JSON.stringify(profile));
 alert('Profile Save হয়েছে।');
}
function loadProfile(){
 profile=JSON.parse(localStorage.getItem('bivas-profile')||'{}');
 Object.entries(profile).forEach(([k,v])=>{if($(k))$(k).value=v;});
}
function loadData(){
 try{
  records=JSON.parse(localStorage.getItem('bivas-records')||'{}');
  holidays=JSON.parse(localStorage.getItem('bivas-holidays')||'[]');
  monthSettings=JSON.parse(localStorage.getItem('bivas-month-settings')||'{}');
 }catch(e){records={};holidays=[];monthSettings={};}
 loadProfile();
}
function holidayName(date){
 let h=holidays.find(x=>x.date===date);
 return h?h.name:'';
}
function defaultType(date,day){
 return holidayName(date)?'Holiday':day===0?'Sunday':'Normal';
}
function saveCurrentMonth(){
 if(!displayedMonthKey)return;
 if($('attendance').children.length)readRecords(displayedMonthKey);
 localStorage.setItem('bivas-records',JSON.stringify(records));
 saveSettings();
}
function readRecords(key){
 let o={};
 document.querySelectorAll('#attendance tr').forEach(tr=>{
  let el=tr.querySelector('.typ');
  if(!el)return;
  o[el.dataset.date]={
   type:el.value,
   in:tr.querySelector('.in').value,
   out:tr.querySelector('.out').value
  };
 });
 records[key]=o;
 return o;
}

 <script>
function hashPassword(p){
 let h=2166136261;
 for(let i=0;i<p.length;i++){
  h^=p.charCodeAt(i);
  h=Math.imul(h,16777619);
 }
 return (h>>>0).toString(16);
}
function ensurePassword(){
 let stored=localStorage.getItem('bivas-time-password');
 if(!stored){
  let p=prompt('নতুন Password তৈরি করুন');
  if(!p||p.length<4){alert('কমপক্ষে ৪ অক্ষর দিন');return false;}
  localStorage.setItem('bivas-time-password',hashPassword(p));
  return true;
 }
 let p=prompt('Password দিন');
 if(p===null||hashPassword(p)!==stored){
  alert('ভুল Password');return false;
 }
 return true;
}
function changePassword(){
 let old=localStorage.getItem('bivas-time-password');
 if(old){
  let p=prompt('বর্তমান Password দিন');
  if(p===null||hashPassword(p)!==old){alert('Password ভুল');return;}
 }
 let n=prompt('নতুন Password দিন');
 if(!n||n.length<4){alert('কমপক্ষে ৪ অক্ষর দিন');return;}
 localStorage.setItem('bivas-time-password',hashPassword(n));
 alert('Password পরিবর্তন হয়েছে');
}

function renderMonth(){
 let yr=Number($('year').value),mo=Number($('month').value);
 if(!Number.isInteger(yr)||yr<2000||yr>2100)return;
 if(displayedMonthKey)saveCurrentMonth();
 let target=monthKey();
 if(target!==displayedMonthKey)applyMonthSettings(target);
 displayedMonthKey=target;

 let tb=$('attendance');
 tb.innerHTML='';
 let saved=records[target]||{};
 let totalDays=new Date(yr,mo+1,0).getDate();

 for(let d=1;d<=totalDays;d++){
  let dt=dateKey(yr,mo,d);
  let day=new Date(yr,mo,d).getDay();
  let r=saved[dt]||{};
  if(holidayName(dt))r.type='Holiday';
  else if(!r.type||r.type==='Holiday')r.type=defaultType(dt,day);

  let tr=document.createElement('tr');
  if(holidayName(dt)||r.type==='Holiday')tr.classList.add('holiday-row');
  else if(day===0||r.type==='Sunday')tr.classList.add('sunday');

  tr.innerHTML=`
  <td>${dt}</td>
  <td>${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][day]}</td>
  <td><select class="typ" data-date="${dt}">
   ${['Normal','Sunday','Holiday','Off','CL'].map(t=>
    `<option ${r.type===t?'selected':''}>${t}</option>`).join('')}
  </select>
  ${holidayName(dt)?`<div class="muted">${holidayName(dt)}</div>`:''}
  </td>
  <td><input type="time" class="in" value="${r.in||''}"></td>
  <td><input type="time" class="out" value="${r.out||''}"></td>
  <td class="worked">0 ঘ 0 মি</td>
  <td class="regular">0 ঘ 0 মি</td>
  <td class="ot">0 ঘ 0 মি</td>`;
  tb.appendChild(tr);
 }

 document.querySelectorAll('#attendance input[type=time]').forEach(el=>{
  el.dataset.last=el.value;
  el.addEventListener('change',()=>{
   if(el.value!==el.dataset.last){
    let v=el.value;
    if(!ensurePassword()){el.value=el.dataset.last;calculate();return;}
    el.dataset.last=v;
    saveCurrentMonth();
    calculate();
   }
  });
 });

 document.querySelectorAll('.typ').forEach(el=>{
  el.addEventListener('change',()=>{
   if(holidayName(el.dataset.date))el.value='Holiday';
   saveCurrentMonth();calculate();
  });
 });
 readRecords(target);
 calculate();
}

function calculate(){
 let rs=records[displayedMonthKey]||{};
 let requiredDays=0,total=0,totalRegular=0,dailyOT=0;
 let dailyDuty=num('dailyHours');

 for(let [date,r] of Object.entries(rs)){
  let day=new Date(date+'T12:00:00').getDay();
  let type=holidayName(date)?'Holiday':(r.type||defaultType(date,day));
  let hrs=getWorkedHours(r.in,r.out);
  let regular=0,extra=0;

  if(type==='Normal'){
   requiredDays++;
   regular=Math.min(hrs,dailyDuty);
   extra=Math.max(0,hrs-dailyDuty);
  }else if(type==='Sunday'||type==='Holiday'){
   extra=hrs;
  }

  total+=hrs;dailyOT+=extra;totalRegular+=regular;
  let tr=document.querySelector(`.typ[data-date="${date}"]`)?.closest('tr');
  if(tr){
   tr.querySelector('.worked').textContent=fmtTime(hrs);
   tr.querySelector('.regular').textContent=fmtTime(regular);
   tr.querySelector('.ot').textContent=fmtTime(extra);
  }
 }

 let required=requiredDays*dailyDuty;
 let salary=num('salary');
 let daily=salary/25;
 let hourly=dailyDuty>0?daily/dailyDuty:0;

 let clAdjusted=Math.min(Math.max(0,required-total),num('clHours'));
 let shortfall=Math.max(0,required-total-clAdjusted);
 let summaryOT=Math.max(0,total+clAdjusted-required);
 let availableCL=Math.max(0,num('clHours')-clAdjusted);
 let deduction=shortfall*hourly;

 let first=salary-num('epf')-num('mediclaim')-num('ptax')-deduction;

 // 2nd Payment Formula: আগের কোডের মতোই রাখা হয়েছে।
 let second=0;
 if(total>=totalRegular){
  second=Math.max(0,(summaryOT+availableCL)*hourly);
 }else{
  second=Math.max(0,(total+clAdjusted-required)*hourly);
 }

 let totalSalary=first+second;
 window.salaryResult={requiredDays,required,total,totalRegular,dailyOT,
 summaryOT,clAdjusted,shortfall,deduction,first,second,totalSalary,
 daily,hourly};

 let vals=[
 ['Daily Basic',`₹${daily.toFixed(2)}`],
 ['Hourly Rate',`₹${hourly.toFixed(2)}`],
 ['Normal Working Days',requiredDays],
 ['Required Duty Hours',fmtTime(required)],
 ['Total Worked Hours',fmtTime(total)],
 ['Total Regular Hours',fmtTime(totalRegular)],
 ['Daily Attendance OT',fmtTime(dailyOT)],
 ['Salary Summary OT',fmtTime(summaryOT)],
 ['CL Adjusted',fmtTime(clAdjusted)],
 ['Shortfall',fmtTime(shortfall)],
 ['Shortfall Deduction',`₹${deduction.toFixed(2)}`],
 ['1st Payment',`₹${first.toFixed(2)}`],
 ['2nd Payment',`₹${second.toFixed(2)}`],
 ['TOTAL SALARY',`₹${totalSalary.toFixed(2)}`]
 ];
 $('summary').innerHTML=vals.map(([k,v])=>
 `<div class="stat"><label>${k}</label><b>${v}</b></div>`).join('');
 updateDashboard();
}
function saveData(){
 saveCurrentMonth();calculate();alert('ডেটা Save হয়েছে।');
}
</script>

 <script>
function addHoliday(){
 let date=$('holidayDate').value;
 let name=$('holidayName').value.trim();
 if(!date||!name){alert('তারিখ ও নাম দিন');return;}
 holidays=holidays.filter(x=>x.date!==date);
 holidays.push({date,name});
 holidays.sort((a,b)=>a.date.localeCompare(b.date));
 localStorage.setItem('bivas-holidays',JSON.stringify(holidays));
 $('holidayDate').value='';$('holidayName').value='';
 renderHolidayList();renderMonth();
}
function renderHolidayList(){
 let box=$('holidayList');box.innerHTML='';
 holidays.forEach((h,i)=>{
  let div=document.createElement('div');div.className='holiday';
  div.textContent=h.date+' — '+h.name+' ';
  let b=document.createElement('button');b.className='danger';
  b.textContent='মুছুন';
  b.onclick=()=>{
   holidays.splice(i,1);
   localStorage.setItem('bivas-holidays',JSON.stringify(holidays));
   renderHolidayList();renderMonth();
  };
  div.appendChild(b);box.appendChild(div);
 });
}

function backup(){
 saveCurrentMonth();
 let data={
  version:1,
  created:new Date().toISOString(),
  records,holidays,monthSettings,profile,
  currentSettings:settingsObject(),
  password:localStorage.getItem('bivas-time-password')
 };
 let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
 let url=URL.createObjectURL(blob);
 let a=document.createElement('a');
 a.href=url;a.download='BIVAS_SALARY_BACKUP.json';
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),60000);
}
function restore(event){
 let file=event.target.files[0];if(!file)return;
 let reader=new FileReader();
 reader.onload=()=>{
  try{
   let d=JSON.parse(reader.result);
   if(!d.records)throw Error('Invalid backup');
   if(!confirm('বর্তমান ডেটার সঙ্গে Backup Restore করবেন?'))return;
   records=d.records||{};
   holidays=d.holidays||[];
   monthSettings=d.monthSettings||{};
   profile=d.profile||{};
   localStorage.setItem('bivas-records',JSON.stringify(records));
   localStorage.setItem('bivas-holidays',JSON.stringify(holidays));
   localStorage.setItem('bivas-month-settings',JSON.stringify(monthSettings));
   localStorage.setItem('bivas-profile',JSON.stringify(profile));
   if(d.currentSettings)localStorage.setItem('bivas-current-settings',JSON.stringify(d.currentSettings));
   if(d.password)localStorage.setItem('bivas-time-password',d.password);
   alert('Backup Restore হয়েছে।');
   location.reload();
  }catch(e){alert('Backup ফাইল সঠিক নয়।');}
  finally{event.target.value='';}
 };
 reader.readAsText(file);
}

function autoBackup(){
 saveCurrentMonth();
 let d={
  records,holidays,monthSettings,profile,
  savedAt:new Date().toISOString()
 };
 try{
  localStorage.setItem('bivas-auto-backup',JSON.stringify(d));
  $('autoBackupStatus').textContent='Local Automatic Backup: '+new Date().toLocaleString();
  alert('Local Backup তৈরি হয়েছে।');
 }catch(e){alert('Storage পূর্ণ। Manual Backup Download করুন।');}
}
function loadAutoBackup(){
 let d=localStorage.getItem('bivas-auto-backup');
 $('autoBackupStatus').textContent=d?'Local Backup উপলব্ধ':'এখনও Local Backup নেই';
}

function salarySlip(){
 saveCurrentMonth();calculate();
 let p=profile,r=window.salaryResult||{};
 let html=`<html><head><meta charset="UTF-8"><title>Salary Slip</title>
 <style>body{font-family:Arial;padding:25px}table{width:100%;border-collapse:collapse}
 td,th{border:1px solid #aaa;padding:9px;text-align:left}
 h2{text-align:center}</style></head><body>
 <h2>BIVAS SALARY MANAGER</h2>
 <h3>Salary Slip — ${months[+$('month').value]} ${$('year').value}</h3>
 <p>Employee: ${escapeHTML(p.employeeName||'')}</p>
 <p>Employee ID: ${escapeHTML(p.employeeId||'')}</p>
 <p>Designation: ${escapeHTML(p.designation||'')}</p>
 <table>
 <tr><td>Basic Salary</td><td>₹${num('salary').toFixed(2)}</td></tr>
 <tr><td>EPF</td><td>₹${num('epf').toFixed(2)}</td></tr>
 <tr><td>Mediclaim</td><td>₹${num('mediclaim').toFixed(2)}</td></tr>
 <tr><td>Professional Tax</td><td>₹${num('ptax').toFixed(2)}</td></tr>
 <tr><td>Shortfall Deduction</td><td>₹${r.deduction.toFixed(2)}</td></tr>
 <tr><td>1st Payment</td><td>₹${r.first.toFixed(2)}</td></tr>
 <tr><td>2nd Payment</td><td>₹${r.second.toFixed(2)}</td></tr>
 <tr><th>Total Salary</th><th>₹${r.totalSalary.toFixed(2)}</th></tr>
 </table><p>Worked: ${fmtTime(r.total)} | OT: ${fmtTime(r.summaryOT)}</p>
 <script>window.onload=()=>window.print();<\/script>
 </body></html>`;
 let w=window.open('','_blank');
 if(!w){alert('Pop-up অনুমতি দিন');return;}
 w.document.write(html);w.document.close();
}
function escapeHTML(s){
 return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function exportExcel(){
 saveCurrentMonth();calculate();
 let rs=records[displayedMonthKey]||{};
 let rows=[['BIVAS SALARY MANAGER'],['Month',months[+$('month').value],$('year').value],
 ['Date','Day','Type','In','Out','Worked','Regular','OT']];
 let total=0,reg=0,ot=0;
 Object.keys(rs).sort().forEach(date=>{
  let r=rs[date],day=new Date(date+'T12:00:00').getDay();
  let type=holidayName(date)?'Holiday':(r.type||defaultType(date,day));
  let h=getWorkedHours(r.in,r.out),a=0,b=0;
  if(type==='Normal'){a=Math.min(h,num('dailyHours'));b=Math.max(0,h-num('dailyHours'));}
  else if(type==='Sunday'||type==='Holiday')b=h;
  total+=h;reg+=a;ot+=b;
  rows.push([date,['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][day],
   type,r.in||'',r.out||'',fmtTime(h),fmtTime(a),fmtTime(b)]);
 });
 rows.push(['Total Worked',fmtTime(total)],['Regular',fmtTime(reg)],['OT',fmtTime(ot)]);
 let csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
 let blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
 let url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=`BIVAS_SALARY_${displayedMonthKey}.csv`;
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),60000);
}
 </script>
<script>
function showHistory(){
 let y=Number($('historyYear').value),m=Number($('historyMonth').value);
 let key=`${y}-${String(m+1).padStart(2,'0')}`;
 let rs=records[key]||{},cfg=monthSettings[key]||{};
 let duty=Number(cfg.dailyHours)||0,total=0,ot=0,days=0;
 Object.entries(rs).forEach(([date,r])=>{
  let day=new Date(date+'T12:00:00').getDay();
  let type=holidayName(date)?'Holiday':(r.type||defaultType(date,day));
  let h=getWorkedHours(r.in,r.out);
  if(type==='Normal'){days++;ot+=Math.max(0,h-duty);}
  else if(type==='Sunday'||type==='Holiday')ot+=h;
  total+=h;
 });
 $('historyResult').textContent=
 `${months[m]} ${y} | Worked: ${fmtTime(total)} | Required: ${fmtTime(days*duty)} | OT: ${fmtTime(ot)} | Basic Salary: ₹${cfg.salary||0}`;
}

function updateDashboard(){
 if(!window.salaryResult)return;
 let r=window.salaryResult;
 let data=[
 ['Employee',profile.employeeName||'Not Set'],
 ['Total Worked',fmtTime(r.total)],
 ['Required Hours',fmtTime(r.required)],
 ['Total OT',fmtTime(r.summaryOT)],
 ['1st Payment',`₹${r.first.toFixed(2)}`],
 ['2nd Payment',`₹${r.second.toFixed(2)}`],
 ['Total Salary',`₹${r.totalSalary.toFixed(2)}`]
 ];
 $('dashboardStats').innerHTML=data.map(([a,b])=>
 `<div class="stat"><label>${escapeHTML(a)}</label><b>${escapeHTML(b)}</b></div>`).join('');
}

function enableNotifications(){
 if(!('Notification' in window)){
  alert('এই Browser Notification সমর্থন করে না।');return;
 }
 Notification.requestPermission().then(p=>{
  alert(p==='granted'?'Notification চালু হয়েছে।':'Notification অনুমতি দেওয়া হয়নি।');
 });
}
function scheduleReminder(){
 let time=prompt('Reminder সময় দিন (24-hour HH:MM), যেমন 20:00');
 if(!time||!/^([01]\d|2[0-3]):[0-5]\d$/.test(time)){
  alert('সঠিক সময় লিখুন।');return;
 }
 localStorage.setItem('bivas-reminder-time',time);
 alert('Reminder সময় Save হয়েছে। Browser খোলা থাকলে Reminder দেখাবে।');
}
function checkReminder(){
 let t=localStorage.getItem('bivas-reminder-time');
 if(!t||!('Notification' in window)||Notification.permission!=='granted')return;
 let now=new Date(),current=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
 let today=now.toISOString().slice(0,10);
 if(current===t&&localStorage.getItem('bivas-reminder-last')!==today){
  new Notification('BIVAS SALARY MANAGER',{body:'আজকের Attendance Entry ও ডেটা Save করুন।'});
  localStorage.setItem('bivas-reminder-last',today);
 }
}
function go(id){
 $(id).scrollIntoView({behavior:'smooth',block:'start'});
}

$('year').addEventListener('change',()=>{saveCurrentMonth();renderMonth();});
$('month').addEventListener('change',()=>{saveCurrentMonth();renderMonth();});

SET_KEYS.forEach(k=>{
 $(k).addEventListener('input',()=>{saveSettings();calculate();});
 $(k).addEventListener('change',()=>{saveSettings();calculate();});
});

function init(){
 loadData();
 let now=new Date();
 $('year').value=now.getFullYear();
 $('month').value=now.getMonth();
 $('historyYear').value=now.getFullYear();
 $('historyMonth').value=now.getMonth();

 let key=monthKey();
 if(monthSettings[key])applyMonthSettings(key);
 else{
  let old=JSON.parse(localStorage.getItem('bivas-current-settings')||'null');
  if(old)Object.entries(old).forEach(([k,v])=>{if($(k))$(k).value=v;});
  monthSettings[key]=settingsObject();
 }
 renderHolidayList();
 renderMonth();
 calculate();
 loadAutoBackup();
 // Local backup snapshot on app start and periodically.
 autoBackup();
}
init();

// Reminder check while the app remains open.
setInterval(checkReminder,30000);
window.addEventListener('beforeunload',()=>{
 try{saveCurrentMonth();}catch(e){}
});
</script>

</main>
